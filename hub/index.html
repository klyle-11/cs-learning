<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#fdfcf7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reader">
<style>
  :root {
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --body: var(--serif);
    --head: var(--sans);
    --paper: #fdfcf7;
    --shade: #f4f1e8;
    --ink: #1d1b16;
    --muted: #6f6a5f;
    --rule: #ddd8ca;
    --accent: #8c2f1b;
    --mark: #fbeeb0;
    --reply: #eef3ea;
    --field: #fff;
    --quote: #3b382f;
    --c-kw: #8c2f1b; --c-str: #2f6f4f; --c-com: #8a8473; --c-num: #a05a00; --c-fn: #1f4e8c; --c-type: #6b3fa0;
  }
  /* Themes. Each one only redefines the colour tokens above. */
  :root[data-theme="selenized"] { /* Selenized Light */
    --paper: #fbf3db; --shade: #ece3cc; --ink: #3a4d53; --muted: #53676d; --rule: #d5cdb6;
    --accent: #0072d4; --mark: #f1dc9a; --reply: #e6ebcb; --field: #fffaea; --quote: #53676d;
    --c-kw: #8762c6; --c-str: #009c8f; --c-com: #909995; --c-num: #c25d1e; --c-fn: #0072d4; --c-type: #ad8900;
  }
  :root[data-theme="lime"] { /* pale lime, a touch cool; golden-sepia ink and accents */
    --paper: #eff9e9; --shade: #e1f0d9; --ink: #4d3c1f; --muted: #7b6535; --rule: #c6dbbb;
    --accent: #8f6a14; --mark: #f6e58d; --reply: #d6ead0; --field: #f9fdf5; --quote: #5f4c2a;
    --c-kw: #8a3b6b; --c-str: #2e7d4f; --c-com: #66725a; --c-num: #a35a00; --c-fn: #1e5fa8; --c-type: #6b3fa0;
  }
  :root[data-theme="sky"] { /* pale sky blue, a touch warm; golden-sepia ink and accents */
    --paper: #f1f6f9; --shade: #e4edf3; --ink: #4d3c1f; --muted: #7b6535; --rule: #cbd9e3;
    --accent: #8f6a14; --mark: #fbe9a6; --reply: #e2ede4; --field: #fcfdfe; --quote: #5f4c2a;
    --c-kw: #8a3fa0; --c-str: #1f7a5c; --c-com: #5d7082; --c-num: #b25a00; --c-fn: #1668a8; --c-type: #5a4fc0;
  }
  :root[data-theme="eva"] { /* Eva Dark */
    color-scheme: dark;
    --paper: #282c34; --shade: #21252b; --ink: #b7c5d3; --muted: #8391a2; --rule: #3b414d;
    --accent: #cf68e1; --mark: #e4bf7f; --reply: #2c3a3a; --field: #1e2228; --quote: #a3b1c0;
    --c-kw: #cf68e1; --c-str: #98c379; --c-com: #6b7686; --c-num: #ff9070; --c-fn: #6495ee; --c-type: #e4bf7f;
  }
  :root[data-theme="triple-m"] {
    color-scheme: dark;
    --paper: #1d163e; --shade: #271e54; --ink: #fffffc; --muted: #b3abd8; --rule: #3e3372;
    --accent: #ff8fc7; --mark: #ffd166; --reply: #2a2563; --field: #150f31; --quote: #dcd7f2;
    --c-kw: #ff8fc7; --c-str: #9be7c4; --c-com: #8d84b8; --c-num: #ffd166; --c-fn: #8ec5ff; --c-type: #c9a7ff;
  }
  :root[data-font="sans"] { --body: var(--sans); --head: var(--serif); }

  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font: var(--fs, 18px)/1.65 var(--body); }

  /* Keyboard focus is always obvious. */
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  [role="button"] { cursor: pointer; }

  /* Roomier text: more space between lines, words and paragraphs. */
  body.roomy .md { line-height: 1.95; letter-spacing: .015em; word-spacing: .08em; }
  body.roomy .md p, body.roomy .md li { margin-bottom: 1.3em; }

  /* Reading focus: everything but the block being read is faded. */
  body.focus .md > * { opacity: .3; }
  body.focus .md > .here, body.focus .md > .editFront { opacity: 1; }
  body.focus .md > .here { box-shadow: -12px 0 0 0 var(--paper), -16px 0 0 0 var(--accent); }
  @media (prefers-reduced-motion: no-preference) { body.focus .md > * { transition: opacity .12s; } }
  a { color: var(--accent); }
  button, textarea { font: inherit; color: inherit; }
  #theme { font: 13px var(--head); color: inherit; background: var(--paper); border: 1px solid var(--rule); padding: 1px 4px; margin: 0 4px 8px 0; }
  button { background: none; border: 1px solid var(--rule); padding: 1px 8px; cursor: pointer; font: 13px var(--head); }

  #app { display: grid; grid-template-columns: 250px minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }
  #mobileBar, #backdrop { display: none; }

  /* right column: the second document (when split) stacked with the notes */
  #right { position: relative; width: var(--right-w, 300px); display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--rule); }
  #right.notes-top { flex-direction: column-reverse; }
  body.no-right #right { display: none; }
  #rightGrip { position: absolute; left: -4px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3; }
  #rightDoc { flex: 1 1 0; min-height: 0; display: flex; }
  #hGrip { flex: 0 0 7px; cursor: row-resize; border-top: 1px solid var(--rule); }
  #right.notes-top #hGrip { border-top: 0; border-bottom: 1px solid var(--rule); }
  #rightGrip:hover, #hGrip:hover { background: var(--rule); }
  #right.no-doc #rightDoc, #right.no-doc #hGrip, #right.no-notes #hGrip, #right.no-notes #notes { display: none; }
  .dragging { user-select: none; }

  /* sidebar: title, file browser, outline of the active document */
  /* sidebar tucked away: it slides back when the left edge is hovered or focused */
  body.side-closed #app { grid-template-columns: minmax(0, 1fr) auto; }
  body.side-closed #side { position: fixed; z-index: 6; left: 0; top: 0; bottom: 0; width: 264px; background: var(--paper); box-shadow: 4px 0 16px rgba(0, 0, 0, .18); transform: translateX(-105%); }
  body.side-closed.side-peek #side, body.side-closed #side:focus-within { transform: none; }
  #sideEdge { display: none; position: fixed; z-index: 5; left: 0; top: 0; bottom: 0; width: 14px; padding: 0; border: 0; border-right: 1px solid var(--rule); background: var(--shade); color: var(--muted); font-size: 11px; }
  body.side-closed #sideEdge { display: block; }
  body.side-closed #work { padding-left: 14px; }
  @media (prefers-reduced-motion: no-preference) { body.side-closed #side { transition: transform .12s; } }
  #workspace { font: 13px var(--head); color: inherit; background: var(--paper); border: 1px solid var(--rule); padding: 1px 4px; margin: 0 10px 8px 0; }
  #sideTools { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 10px 8px 0; }
  #sideTools button, #sideTools select { margin: 0 !important; }
  #sideTools button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #side { display: flex; flex-direction: column; min-height: 0; padding: 14px 0 0 14px; font: 14px/1.4 var(--head); border-right: 1px solid var(--rule); }
  #sideHead { display: flex; align-items: center; gap: 2px; margin: 0 8px 8px 0; }
  #hubTitle { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; margin: 0 4px 0 -4px; padding: 2px 4px; cursor: text; }
  /* icon buttons: the sidebar's own controls, and the player's */
  .ic { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 3px; border: 0; color: var(--muted); }
  .ic svg { display: block; width: 100%; height: 100%; }
  .ic:hover, .ic[aria-expanded="true"] { color: var(--accent); }
  /* settings: text, connection and this device, shown by the gear */
  #settings { flex: none; max-height: 60%; overflow-y: auto; margin-bottom: 8px; }
  #settings[hidden] { display: none; }
  #netBrief { display: block; margin: 0 10px 8px 0; padding: 0; border: 0; text-align: left; color: #c0392b; font-size: 12.5px; }
  #netBrief[hidden], #settings:not([hidden]) ~ #netBrief { display: none; }
  .label.row { display: flex; align-items: center; gap: 2px; padding-right: 8px; }
  .label.row .ic:first-of-type { margin-left: auto; }
  #hubTitle:hover, #hubTitle:focus { outline: 1px dashed var(--rule); }
  #sideTools button { margin: 0 4px 8px 0; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 0 4px; border-top: 1px solid var(--rule); }
  #tree, #toc { flex: 1 1 50%; min-height: 0; overflow-y: auto; padding: 0 8px 12px 0; }
  /* the outline takes what it needs, up to under half; the files get the rest */
  #tree { flex: 1 1 0; }
  #toc { flex: 0 1 auto; max-height: 45%; }
  #tree summary { cursor: pointer; padding: 2px 0; font-weight: 600; }
  #tree .kids { padding-left: 14px; }
  .file { display: flex; align-items: baseline; gap: 6px; padding: 2px 4px; cursor: pointer; color: var(--muted); }
  .file span.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file.open { color: var(--ink); }
  .file.active { color: var(--accent); background: var(--shade); }
  .file small { color: var(--muted); }
  .file button { visibility: hidden; border: 0; padding: 0 2px; color: var(--accent); font-size: 11px; }
  .file:hover button, .file:focus-within button { visibility: visible; }
  .file .plus { font-size: 15px; font-weight: 700; }
  #toc a { display: block; padding: 3px 0 3px 8px; color: var(--muted); text-decoration: none; border-left: 2px solid transparent; }
  #toc a.l1 { color: var(--ink); font-weight: 600; margin-top: 8px; }
  #toc a.l3 { padding-left: 22px; font-size: 13px; }
  #toc a.active { color: var(--accent); border-left-color: var(--accent); }

  /* workspace: one or two panes, each with tabs along the top */
  #work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #panes { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  /* how far through the document the reader is */
  .progress { flex: none; height: 3px; background: var(--shade); }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }
  .pane.active .tabs { box-shadow: inset 0 3px 0 var(--accent); }
  .dragging iframe { pointer-events: none; }
  .tabs { display: flex; align-items: stretch; background: var(--shade); border-bottom: 1px solid var(--rule); font: 13px var(--head); overflow-x: auto; flex: none; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 7px 8px 6px 12px; border-right: 1px solid var(--rule); border-top: 2px solid transparent; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .tab span { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .tab.preview span { font-style: italic; }
  .tab.active { background: var(--paper); color: var(--ink); }
  .pane.active .tab.active { border-top-color: var(--accent); }
  .tab button, .tabs > button { border: 0; padding: 0 4px; color: var(--muted); }
  .tabs > button + button { margin-left: 0 !important; }
  .tabs > button[aria-pressed="true"] { color: var(--accent); }
  .tabs > button { margin-left: auto; padding: 0 10px; white-space: nowrap; flex: none; position: sticky; right: 0; background: var(--shade); }
  .tab { flex: none; }
  /* back, at the start of the tab bar */
  .tabs > button.back { margin-left: 0; left: 0; right: auto; z-index: 1; padding: 0 12px; border-right: 1px solid var(--rule); color: var(--ink); font-size: 20px; line-height: 1; }
  .tabs > button.back:disabled { color: var(--rule); cursor: default; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* a document scrolls up and down only; wide tables and code scroll inside themselves */
  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-x: none; padding: 0 32px; }
  .body iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .empty { color: var(--muted); font: 14px var(--head); padding: 24px 32px; }

  /* contents dial: shown when the sidebar is not. A bare icon over the page;
     it opens a small scrolling list where the centred heading is the big one. */
  #work { position: relative; }
  #tocBtn { display: none; position: absolute; z-index: 4; top: 44px; right: 14px; width: 34px; height: 34px; padding: 6px; border: 0; background: transparent; color: var(--muted); }
  #tocBtn svg { display: block; width: 100%; height: 100%; }
  #tocBtn[aria-expanded="true"] { color: var(--accent); }
  body.side-closed #tocBtn { display: block; }
  #dial { position: absolute; z-index: 4; top: 82px; right: 10px; width: min(72%, 300px); height: 46vh; overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y mandatory; padding: calc(23vh - 13px) 0; background: color-mix(in srgb, var(--paper) 93%, transparent); border: 1px solid var(--rule); font-family: var(--head); }
  #dial[hidden] { display: none; }
  #dial .d { height: 26px; line-height: 26px; padding: 0 10px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; scroll-snap-align: center; cursor: pointer; }
  #dial .d.l2 { padding-left: 20px; }
  #dial .d.l3 { padding-left: 30px; }
  #dial .d.sel { font-size: 16px; font-weight: 700; color: var(--accent); padding-left: 10px; border-left: 3px solid var(--accent); }
  #dial .none { padding: 0 10px; font-size: 12px; color: var(--muted); }

  /* connection and device-copy status */
  #net { margin: 0 10px 10px 0; padding: 6px 8px; border: 1px solid var(--rule); font-size: 12.5px; line-height: 1.45; }
  #net b { font-weight: 600; }
  #net .dot, #mobileBar .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3f8f4f; margin-right: 6px; }
  body.offline #net .dot, body.offline #mobileBar .dot { background: #c0392b; }
  body.offline #net { border-color: #c0392b; }
  #net .sub { color: var(--muted); }
  #net button { border: 0; padding: 0; color: var(--accent); font-size: 12.5px; text-decoration: underline; }
  #net .say { color: #c0392b; }
  .file .st { visibility: visible !important; display: inline-block !important; border: 0; padding: 0 2px; font-size: 11px; color: var(--muted); }
  .file .st.kept { color: #3f8f4f; }
  .file .st.wait { color: #b9770e; font-weight: 700; }
  #side.drop { outline: 3px dashed var(--accent); outline-offset: -3px; }

  /* music player: one player for the whole reader, with the playlist as a document */
  .player { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 80px; font: 14px/1.4 var(--head); }
  .player .now { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  .player .where { color: var(--muted); margin-bottom: 12px; }
  .pl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .pl-row button { padding: 6px 14px; font-size: 14px; }
  .pl-seek { flex: 1; min-width: 140px; accent-color: var(--accent); }
  .pl-vol { width: 110px; accent-color: var(--accent); }
  .pl-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .player h5 { margin: 18px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .track { display: flex; gap: 10px; align-items: baseline; padding: 6px 6px; border-top: 1px solid var(--rule); cursor: pointer; }
  .track.cur { color: var(--accent); font-weight: 700; background: var(--shade); }
  .track.gone { color: var(--muted); cursor: default; }
  .track span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track .st { border: 0; padding: 0 4px; font-size: 12px; color: var(--muted); }
  .track .st.kept { color: #3f8f4f; }
  /* the queue: its button on a row, and the list under the controls */
  .q { color: var(--muted); align-self: center; }
  .q.on, .q:hover { color: var(--accent); }
  .track .q, .listing .item .q, .viewbar .q { width: 22px; height: 22px; padding: 2px; }
  .file .q { width: 18px; height: 18px; padding: 1px; }
  .file .q.on { visibility: visible; }
  .pl-row .ic.off { opacity: .4; }
  .ic.kept { color: #3f8f4f; }
  .ic:disabled { opacity: .4; cursor: default; }
  .viewbar .keepB { width: 22px; height: 22px; padding: 2px; }
  .thumb .keepB { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; padding: 5px; border-radius: 50%; background: color-mix(in srgb, var(--paper) 88%, transparent); }
  .qnone { margin: 4px 0; color: var(--muted); font-size: 13px; }
  .qlink { display: block; border: 0; padding: 0; margin: 6px 0; color: var(--accent); text-decoration: underline; }
  .pl-row .ic { width: 34px; height: 34px; padding: 7px; border: 1px solid var(--rule); color: inherit; }
  /* the sidebar's footer, below the outline and outside its scrolling: the name, then one line of icons with the time at its end */
  #mini { flex: none; margin-left: -14px; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)) 14px; border-top: 1px solid var(--rule); background: var(--shade); font-size: 12px; }
  #mini .pl-row { flex-wrap: nowrap; gap: 1px; margin: 0; }
  #mini .pl-row .ic { width: 22px; height: 22px; padding: 4px; border: 0; margin: 0; }
  #mini .pl-time { margin-left: auto; padding-left: 4px; font-size: 11px; white-space: nowrap; }
  /* a video that carries on in the background: kept in the page, out of sight */
  #park { position: fixed; left: -10px; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #park video { width: 1px; height: 1px; }

  /* privacy: connection, this device, copies kept here */
  #privacy { margin: 0 10px 10px 0; padding: 6px 8px; border: 1px solid var(--rule); font-size: 12.5px; line-height: 1.5; }
  #privacy:empty { display: none; }
  #privacy b { font-weight: 600; }
  #privacy button { border: 0; padding: 0; color: var(--accent); font-size: 12.5px; text-decoration: underline; }
  #privacy .say, .say { color: #c0392b; }

  /* the gate: unlocking, pairing, and the panels for devices and the passphrase */
  #gate { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 8vh 16px; background: color-mix(in srgb, var(--paper) 94%, transparent); font: 15px/1.5 var(--head); }
  #gate[hidden] { display: none; }
  #gate .card { position: relative; width: min(100%, 440px); padding: 20px 22px; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
  #gate h2 { margin: 0 0 10px; font-size: 19px; }
  #gate p { margin: 0 0 10px; }
  #gate label { display: block; margin: 10px 0; font-size: 13px; color: var(--muted); }
  #gate select { display: block; width: 100%; margin: 0 0 10px; padding: 6px 8px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); font: 14px var(--head); }
  #gate input { display: block; width: 100%; margin-top: 3px; padding: 8px 10px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); font: 16px var(--head); }
  #gate button { font-size: 14px; padding: 4px 10px; }
  #gate button.main { display: block; margin: 12px 0 8px; padding: 8px 18px; background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #gate button.main:disabled { opacity: .5; }
  #gate button.link { display: block; border: 0; padding: 4px 0; color: var(--accent); text-decoration: underline; text-align: left; }
  #gate button.x { position: absolute; top: 14px; right: 14px; border: 0; color: var(--muted); }
  #gate .code { font: 700 28px Menlo, Consolas, monospace; letter-spacing: .08em; margin: 8px 0 4px; }
  #gate .code:empty { display: none; }
  #gate .sub { color: var(--muted); font-size: 13px; }
  #gate .dev { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--rule); }
  #gate .dev span { flex: 1; }
  #gate .dev small { color: var(--muted); }

  /* problems: a plain sentence, with the technical part folded away */
  #problems { position: fixed; z-index: 21; right: 12px; bottom: 12px; width: min(calc(100vw - 24px), 380px); display: flex; flex-direction: column; gap: 8px; font: 13.5px/1.45 var(--head); }
  .problem { padding: 10px 12px; background: var(--paper); border: 1px solid #c0392b; border-left-width: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }
  .problem p { margin: 2px 0 6px; }
  .problem summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .problem pre { margin: 6px 0; padding: 6px 8px; background: var(--shade); font: 11.5px/1.4 Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow-y: auto; }
  .problem .row { display: flex; gap: 8px; margin-top: 6px; }
  #panes > .problem, .body > .problem { margin: 24px 32px; box-shadow: none; align-self: flex-start; }
  #mini[hidden] { display: none; }
  #mini a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; text-decoration: underline; margin-bottom: 2px; }

  /* picture, video and sound viewer */
  .viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .viewbar { flex: none; display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--rule); font: 13px var(--head); }
  .viewbar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .viewbar a { color: var(--accent); white-space: nowrap; }
  .stage { flex: 1; min-height: 0; overflow: auto; display: flex; background: var(--shade); overscroll-behavior: contain; }
  .stage img, .stage video, .stage audio { display: block; margin: auto; }
  .stage.fit img, .stage.fit video { max-width: 100%; max-height: 100%; object-fit: contain; }
  .stage.fit img { cursor: zoom-in; }
  .stage:not(.fit) img { cursor: zoom-out; max-width: none; }
  .stage video { background: #000; }
  .stage audio { width: min(90%, 480px); }
  .md img { cursor: zoom-in; }

  /* a rendered document */
  .md { max-width: 40em; margin: 0 auto; padding: 16px 0 120px; }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--head); line-height: 1.25; scroll-margin-top: 12px; }
  .md h1 { font-size: 1.7em; margin-top: 1.6em; border-bottom: 1px solid var(--rule); padding-bottom: .2em; }
  .md h2 { font-size: 1.25em; margin-top: 1.8em; }
  .md blockquote { margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--rule); color: var(--quote); }
  .md pre { background: var(--shade); padding: 12px; overflow-x: auto; font-size: 14px; line-height: 1.45; }
  .md code { font-family: Menlo, Consolas, monospace; font-size: .86em; }
  /* code colours, by token; the values come from the theme */
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--c-kw); }
  .hljs-string, .hljs-regexp, .hljs-char, .hljs-meta .hljs-string { color: var(--c-str); }
  .hljs-comment, .hljs-quote { color: var(--c-com); font-style: italic; }
  .hljs-number, .hljs-symbol, .hljs-meta, .hljs-attr, .hljs-variable { color: var(--c-num); }
  .hljs-title, .hljs-section, .hljs-name { color: var(--c-fn); }
  .hljs-type, .hljs-built_in, .hljs-class .hljs-title { color: var(--c-type); }
  .md { overflow-wrap: anywhere; }
  .md table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .92em; }
  .md td, .md th { border: 1px solid var(--rule); padding: 6px 10px; vertical-align: top; }
  .md img { max-width: 100%; }
  .md hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
  .md summary { cursor: pointer; color: var(--accent); font: 14px var(--head); }
  mark { background: var(--mark); color: #1d1b16; cursor: pointer; }
  mark.flash, .note.flash { outline: 2px solid var(--accent); }
  .note.on { background: var(--shade); }
  /* highlight flyout and type legend */
  #flyout { position: fixed; z-index: 5; display: flex; gap: 7px; align-items: center; padding: 6px 8px; background: var(--field); border: 1px solid var(--rule); box-shadow: 0 2px 8px rgba(0, 0, 0, .14); }
  #flyout[hidden] { display: none; }
  #flyout button:not(.sw) { border: 0; padding: 0 2px; color: var(--accent); font-size: 12px; }
  .sw { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .25); padding: 0; flex: none; vertical-align: -3px; }
  .sw.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  mark.on { box-shadow: 0 0 0 2px var(--accent); }
  #types { margin-bottom: 16px; }
  .type { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .type input { width: 20px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
  .type span { flex: 1; padding: 1px 3px; cursor: text; }
  .type span:hover, .type span:focus { outline: 1px dashed var(--rule); }
  .type.cur span { font-weight: 600; }
  #types > button { margin-top: 6px; border: 0; padding: 0; color: var(--accent); font-size: 12px; }
  .editFront { float: right; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  /* a locked folder: the password form, in place of the document */
  .lockbox { width: min(100%, 420px); margin: 8vh auto; padding: 20px 22px; border: 1px solid var(--rule); font: 15px/1.5 var(--head); }
  .lockbox h2 { margin: 0 0 10px; font-size: 19px; }
  .lockbox p { margin: 0 0 10px; }
  .lockbox label { display: block; margin: 10px 0; font-size: 13px; color: var(--muted); }
  .lockbox input { display: block; width: 100%; margin-top: 3px; padding: 8px 10px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); font: 16px var(--head); }
  .lockbox button.main { display: block; margin: 12px 0 8px; padding: 8px 18px; font-size: 14px; background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .lockbox button.main:disabled { opacity: .5; }
  .lockbox button.link { display: block; border: 0; padding: 4px 0; margin-top: 14px; color: var(--muted); text-decoration: underline; text-align: left; }
  #gate label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; }
  #gate label.check input { display: inline; width: auto; margin: 0; }
  #gate button:disabled { opacity: .45; cursor: default; }
  /* front page: what is in here, by kind */
  .browse { margin-top: 1.6em; font-family: var(--head); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border: 1px solid var(--rule); background: none; font: 14px var(--head); color: var(--ink); }
  .tile svg { width: 34px; height: 34px; color: var(--muted); }
  .tile small { color: var(--muted); }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .tile[aria-pressed="true"] svg { color: var(--accent); }
  .tile:disabled { opacity: .45; cursor: default; }
  .listing { margin-top: 14px; font-size: 14.5px; }
  .listing h5 { margin: 16px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .listing .item { display: flex; gap: 8px; align-items: baseline; padding: 4px 2px; border-top: 1px solid var(--rule); cursor: pointer; }
  .listing .item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .listing .item small { color: var(--muted); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .thumb { display: block; padding: 0; border: 1px solid var(--rule); background: var(--shade); aspect-ratio: 1; overflow: hidden; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb b { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 5px; background: color-mix(in srgb, var(--paper) 88%, transparent); font: 11px var(--head); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .thumb i { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 12px var(--head); color: var(--muted); font-style: normal; }
  .frontEditor { max-width: 720px; margin: 0 auto; padding: 16px 0; }
  .frontEditor textarea { width: 100%; min-height: 55vh; padding: 12px; border: 1px solid var(--rule); background: var(--field); font: 14px/1.5 Menlo, Consolas, monospace; }
  .frontEditor button { margin: 8px 8px 0 0; padding: 4px 12px; }
  .frontEditor p { font: 13px var(--head); color: var(--muted); }

  /* notes: a separate layer beside the documents */
  #notes { flex: 0 0 var(--notes-h, 40%); min-height: 0; overflow-y: auto; padding: 14px; font: 14px/1.4 var(--head); }
  #right.no-doc #notes { flex: 1 1 0; }
  #notes .flip { float: right; border: 0; padding: 0; color: var(--accent); font-size: 12px; }
  #notes h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  #notes .empty { padding: 0; }
  .note { border-top: 1px solid var(--rule); padding: 10px 0; }
  .note .quote { font-family: var(--body); font-style: italic; color: var(--muted); border-left: 3px solid var(--mark); padding-left: 8px; margin-bottom: 6px; cursor: pointer; }
  .note .text { font-family: var(--body); font-size: 15px; white-space: pre-wrap; }
  .note .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .note .meta button { border: 0; padding: 0; margin-left: 8px; color: var(--accent); font-size: 12px; }
  .note .reply { background: var(--reply); padding: 8px 10px; margin-top: 8px; font-family: var(--body); font-size: 15px; }
  .note .reply p { margin: 0 0 .5em; }

  /* composer: along the bottom, like talking to the open document */
  #composer { flex: none; border-top: 1px solid var(--rule); padding: 8px 32px 12px; }
  #composer .inner { max-width: 720px; margin: 0 auto; }
  #grip { display: block; width: 64px; height: 16px; margin: -4px auto 2px; padding: 0; border: 0; cursor: ns-resize; touch-action: none; }
  #grip::before { content: ''; display: block; width: 40px; height: 4px; margin: 6px auto; border-radius: 2px; background: var(--rule); }
  #grip:hover::before, #grip:focus-visible::before { background: var(--muted); }
  #context { font: 13px var(--head); color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #context b { color: var(--ink); font-weight: 600; }
  #context button { border: 0; padding: 0 4px; color: var(--accent); }
  #input { display: block; width: 100%; height: 56px; resize: none; padding: 8px 10px; border: 1px solid var(--rule); background: var(--field); font: 16px/1.4 var(--body); }

  /* ---- phone: one column; files and notes become slide-over drawers ---- */
  @media (max-width: 760px) {
    #app { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: auto minmax(0, 1fr); }
    #mobileBar { display: flex; grid-row: 1; align-items: center; gap: 8px; padding: 6px 8px; background: var(--shade); border-bottom: 1px solid var(--rule); font: 14px var(--head); }
    #mobileBar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
    #mobileBar button { padding: 8px 12px; font-size: 14px; background: var(--paper); }
    #work { grid-row: 2; padding-left: 0 !important; }
    #tocBtn { display: block; right: 6px; }
    #dial { right: 6px; }

    #side { position: fixed; z-index: 8; left: 0; top: 0; bottom: 0; width: min(86vw, 330px); background: var(--paper); box-shadow: 4px 0 16px rgba(0, 0, 0, .25); transform: translateX(-105%) !important; font-size: 15px; }
    body.m-side #side { transform: none !important; visibility: visible; }
    #side, #right { visibility: hidden; }   /* closed drawers take no part in scrolling */
    #app { overflow: hidden; }
    #right { display: flex !important; position: fixed; z-index: 8; right: 0; top: 0; bottom: 0; width: min(92vw, 430px) !important; background: var(--paper); box-shadow: -4px 0 16px rgba(0, 0, 0, .25); transform: translateX(105%); }
    body.m-right #right { transform: none; visibility: visible; }
    #right.no-notes #notes { display: block; flex: 1 1 0; }
    body.m-side #backdrop, body.m-right #backdrop { display: block; position: fixed; inset: 0; z-index: 7; background: rgba(0, 0, 0, .4); }
    #sideEdge, #sideToggle, #notesToggle, #rightGrip, .tabs > button:not(.keep), .file .sideBtn { display: none !important; }
    .file .plus { visibility: visible; font-size: 22px; line-height: 1; padding: 0 10px; }
    .file .q { visibility: visible; width: 32px; height: 32px; padding: 6px; }
    .track .q, .listing .item .q, .viewbar .q { width: 34px; height: 34px; padding: 6px; }
    .viewbar .keepB, .thumb .keepB { width: 34px; height: 34px; padding: 7px; }

    /* icons and settings sized for a thumb */
    #sideHead .ic, .label.row .ic { width: 38px; height: 38px; padding: 8px; }
    #mini .pl-row .ic { width: 36px; height: 36px; padding: 8px; }
    #mini { font-size: 13.5px; }
    #sideTools { gap: 6px; }
    #sideTools button, #sideTools select { padding: 6px 10px; font-size: 14px; }
    #net, #privacy, #net button, #privacy button, #netBrief { font-size: 13.5px; }
    #gate { padding: 5vh 12px; }
    #gate button:not(.x):not(.link) { padding: 9px 14px; }
    #gate button.link { padding: 9px 0; }
    .file { padding: 8px 6px; }
    #tree summary { padding: 7px 0; }
    #toc a { padding: 7px 0 7px 8px; }
    .scroller { padding: 0 16px; }
    .md { padding: 8px 0 60px; }
    .md h1 { font-size: 1.45em; }
    .tab { padding: 9px 8px 8px 12px; }

    /* the input sits in the lower part of the screen and grows while typing */
    #composer { padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); }
    #input { height: 46px; }
    #flyout { gap: 12px; padding: 9px 12px; }
    #flyout .sw { width: 28px; height: 28px; }
    #flyout button:not(.sw) { font-size: 15px; padding: 4px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="mobileBar"><button id="mFiles" aria-label="Files and outline">☰ Files</button><b><span class="dot"></span><span id="mTitle"></span></b><button id="mNotes">Notes</button></header>
  <button id="sideEdge" aria-label="Show sidebar" title="Sidebar (hover to peek, click to keep open)">›</button>
  <nav id="side" aria-label="Files and outline">
    <div id="sideHead">
      <h1 id="hubTitle" contenteditable="plaintext-only" spellcheck="false" title="Click to rename"></h1>
      <button id="notesToggle" class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16"/><path d="M15 4v16"/></svg></button>
      <button id="sideToggle" class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16"/><path d="M9 4v16"/></svg></button>
      <button id="settingsBtn" class="ic" aria-expanded="false" aria-controls="settings" aria-label="Settings" title="Settings: text, connection, this device"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div id="settings" hidden>
      <div class="label">Text</div>
      <div id="sideTools"><select id="theme" title="Theme"><option value="plain">Plain</option><option value="selenized">Selenized Light</option><option value="lime">Pale Lime</option><option value="sky">Pale Sky</option><option value="eva">Eva Dark</option><option value="triple-m">Triple-M</option></select><button id="fontToggle"></button><button id="focusToggle" title="Fade everything except the paragraph you are reading">reading focus</button><button id="roomyToggle" title="More space between lines and words">roomy text</button><button id="smaller" aria-label="Smaller text" title="Smaller text">A−</button><button id="bigger" aria-label="Larger text" title="Larger text">A+</button></div>
      <div class="label">Connection</div>
      <div id="net" role="status" aria-live="polite"></div>
      <div class="label">This device</div>
      <div id="privacy" role="status"></div>
    </div>
    <button id="netBrief" hidden title="Open the settings for the details"></button>
    <select id="workspace" title="Workspace" hidden></select>
    <div class="label row">Files<button id="addBtn" class="ic" aria-label="Add files" title="Add files from this device. If the server is out of reach they are held here and sent later."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><input id="fileInput" type="file" multiple hidden><button id="uploadBtn" class="ic" aria-label="Upload a folder" title="Bring a folder from your computer into the hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/><path d="M12 17v-6M9.5 13.5L12 11l2.5 2.5"/></svg></button><input id="folderInput" type="file" webkitdirectory multiple hidden></div>
    <div id="tree"></div>
    <div class="label">Outline</div>
    <div id="toc"></div>
    <div id="mini" hidden></div>
  </nav>
  <div id="work" role="main">
    <div id="panes"></div>
    <button id="tocBtn" type="button" aria-label="Contents of this document" aria-expanded="false" title="Contents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M3 5h3M9 5h12M3 12h3M9 12h9M3 19h3M9 19h6"/></svg></button>
    <div id="dial" hidden></div>
    <form id="composer">
      <div class="inner">
        <button type="button" id="grip" aria-label="Make the note box taller or shorter" title="Drag up to make the note box taller, or press to switch between small and tall"></button>
        <div id="context"></div>
        <textarea id="input" placeholder="Write a note or a question…  (Enter to save, Shift+Enter for a new line)"></textarea>
      </div>
    </form>
  </div>
  <div id="right">
    <div id="rightGrip" title="Drag to resize"></div>
    <div id="rightDoc"></div>
    <div id="hGrip" title="Drag to resize"></div>
    <aside id="notes"></aside>
  </div>
</div>
<div id="backdrop"></div>
<div id="park" aria-hidden="true"></div>
<div id="problems" aria-live="assertive"></div>
<div id="gate" hidden role="dialog" aria-modal="true"></div>
<div id="flyout" hidden></div>

<script src="/vendor/marked.js"></script>
<script src="/vendor/highlight.js"></script>
<script src="/vendor/purify.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>

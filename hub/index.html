    .md table.wide td { display: block; border: 0; border-top: 1px solid var(--rule); padding: 6px 10px; }
    .md table.wide td:first-child { border-top: 0; background: var(--shade); font-weight: 600; }
    .md table.wide td:empty { display: none; }
    .md table.wide td[data-label]::before { content: attr(data-label); display: block; font: 400 11px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .md { padding: 8px 0 60px; }
    .md h1 { font-size: 1.45em; }
    .tab { padding: 9px 8px 8px 12px; }

    /* a picture, a video or a gallery of links is a lightbox: the whole screen, the top bar and the tabs out of the way, the note box below it */
    body.lightbox #mobileBar, body.lightbox .tabs, body.lightbox .progress, body.lightbox #tocBtn { display: none; }
    /* every control on the screen, nothing to scroll to: the name gives way first, the link says less, and what still does not fit goes on a second row */
    body.lightbox .viewbar { padding: calc(6px + env(safe-area-inset-top)) 8px 6px; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    body.lightbox .viewbar a i { display: none; }
    body.lightbox .viewbar button, body.lightbox .viewbar a { flex: none; white-space: nowrap; }
    body.lightbox .viewbar button:not(.ic) { padding: 6px 10px; }
    body.lightbox .viewbar .lbOnly { display: inline-block; }
    body.lightbox .viewbar .x { order: -1; margin-right: auto; font-size: 20px; line-height: 1; }   /* the way out, first: at the left end of the bar, the rest at the right */
    /* a picture at its real size: the screen is the picture; the bar, the arrows and the reel lie over it */
    body.lightbox.immersive #composer { display: none; }
    body.lightbox.immersive .viewer.lb { position: relative; }
    body.lightbox.immersive .viewbar, body.lightbox.immersive .reel { position: absolute; z-index: 2; left: 0; right: 0; background: color-mix(in srgb, var(--paper) 82%, transparent); }
    body.lightbox.immersive .viewbar { top: 0; }
    body.lightbox.immersive .reel { bottom: 0; }
    body.lightbox.immersive .viewbar .immOnly { display: inline-block; }

    /* the note box lies along the foot of the screen, edge to edge, over the page */
    #composer { left: 0; bottom: 0; width: 100%; transform: translateY(calc(-1 * var(--kb, 0px))); border-width: 1px 0 0; border-radius: 0; box-shadow: none; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); }
    #input { height: 46px; padding: 8px 18px; border-radius: 0 0 40px 40px; }   /* the lower corners follow the phone's own, which are far rounder than a window's */
    #flyout { gap: 12px; padding: 9px 12px; }
    #flyout .sw { width: 28px; height: 28px; }
    #flyout button:not(.sw) { font-size: 15px; padding: 4px; }
  }

  /* ---- Soft edges (settings: "soft edges"). The same colours, in any theme, with rounded corners and controls that
     are a faint fill rather than an outline. Where two parts of the reader meet there is no line and no shadow: the
     line's own colour, at the edge, fading into the background of the part it belongs to. What floats over the page
     (a dialog, a menu, the note box) is ringed the same way, the line's colour fading outward. Defaults are changed
     with :where(), so such a rule weighs no more than the default it replaces (a plain `button`) and whatever has a
     look of its own keeps it; the reader's own parts are named one by one below. A document's own lines (tables,
     rules, quotes) are left as they are. ---- */
  :root[data-edges="soft"], :root[data-edges="soft"] [data-theme] {
    --fade: 14px;                                              /* how far a line's colour runs before it is gone */
    --tint: color-mix(in srgb, var(--ink) 6%, transparent);    /* a control's fill, in place of its outline */
    --faint: color-mix(in srgb, var(--rule) 45%, transparent); /* a line between rows, barely there */
    --ring: 0 0 var(--fade) 2px var(--rule);                   /* the line's colour around something that floats, fading out */
    --ring-small: 0 0 8px 1px var(--rule);
  }
  :where(:root[data-edges="soft"]) button:where(:not(.ic, .sw)) { border-color: transparent; background: var(--tint); border-radius: 9px; }
  /* buttons drawn as links, icons or rows of a list have no outline to begin with: they stay without a fill */
  :root[data-edges="soft"] :is(.file button, .tab button, .tabs > button, .recent button, #net button, #hubsBox button, #panes > button.link, #privacy button,
    #gate button.link, #flyout button:not(.sw), #types > button, .lockbox button.link, .searches .item button, .note .meta button, #context button) { background: none; }
  :root[data-edges="soft"] :focus-visible { border-radius: 9px; }
  /* fields: no outline; the line's colour fades in a little from their edges */
  :root[data-edges="soft"] :is(#theme, #themeSide, #themeRight, #workspace, #hubSel, #find, #gate select, #gate input, .lockbox input, #pickBar input, .frontEditor textarea, #input) {
    border-color: transparent; border-radius: 10px; box-shadow: inset 0 0 6px var(--rule);
  }
  :root[data-edges="soft"] :is(#theme, #themeSide, #themeRight, #workspace, #hubSel) { background: var(--tint); box-shadow: none; }
  :root[data-edges="soft"] #sideTools :is(button, select) { border-color: transparent; border-radius: 9px; }
  /* where two parts meet: the line's colour at the edge, fading into the part's own background */
  :root[data-edges="soft"] #side { border-right-color: transparent; background-image: linear-gradient(to left, var(--rule), transparent var(--fade)); }
  :root[data-edges="soft"] #right { border-left-color: transparent; background-image: linear-gradient(to right, var(--rule), transparent var(--fade)); }
  :root[data-edges="soft"] #sideEdge { border-right-color: transparent; background-image: linear-gradient(to left, var(--rule), transparent 8px); }
  :root[data-edges="soft"] #hGrip { border-color: transparent; background: linear-gradient(to bottom, transparent, var(--rule) 50%, transparent); }
  :root[data-edges="soft"] #rightGrip:hover, :root[data-edges="soft"] #hGrip:hover { background: var(--tint); }
  :root[data-edges="soft"] .tabs { border-bottom-color: transparent; background-image: linear-gradient(to top, var(--rule), transparent var(--fade)); }
  :root[data-edges="soft"] .tab { border-right-color: transparent; border-radius: 10px 10px 0 0; }
  :root[data-edges="soft"] .tabs > button:is(.back, .recentB, .newTab) { border-color: transparent; background: none; border-radius: 0; }
  :root[data-edges="soft"] .viewbar { border-bottom-color: transparent; background-image: linear-gradient(to top, var(--rule), transparent var(--fade)); }
  :root[data-edges="soft"] :is(#mini, .reel) { border-top-color: transparent; background-image: linear-gradient(to bottom, var(--rule), transparent var(--fade)); }
  :root[data-edges="soft"] #composer { border-color: transparent; box-shadow: var(--ring); }
  /* boxes in the settings, and lists that stand apart: a faint fill and round corners, no outline */
  :root[data-edges="soft"] :is(#net, #privacy, #hubsBox, #found, .latest) { border-color: transparent; background: var(--tint); border-radius: 12px; }
  :root[data-edges="soft"] .lockbox { border-color: transparent; background: var(--tint); border-radius: 18px; }
  /* what floats over the page: rounder, ringed by the line's colour fading out */
  :root[data-edges="soft"] :is(#gate .card, .ask > div) { border-color: transparent; border-radius: 18px; box-shadow: var(--ring); }
  :root[data-edges="soft"] :is(#flyout, .recent, #dial, .linkcard .fly) { border-color: transparent; border-radius: 14px; box-shadow: var(--ring); }
  :root[data-edges="soft"] :is(.pageCover, #coverBtn, .turnHint, .pl-row .ic, #tree summary .quick, .tag) { border-color: transparent; border-radius: 10px; box-shadow: var(--ring-small); }
  :root[data-edges="soft"] :is(.tile, .thumb, .linkcard, .md .onecard) { border-color: transparent; border-radius: 14px; box-shadow: var(--ring-small); overflow: hidden; }
  :root[data-edges="soft"] :is(#tree .kind.pic img, .tab .tabCover, .md img.cover) { border-color: transparent; border-radius: 6px; }
  /* lines between rows: still there, barely */
  :root[data-edges="soft"] :is(.note, .hit, .track, .listing .item, #gate .dev, .label, #tree .sect, .editFront, .linksAsk .fly, .linkcard.super iframe) { border-top-color: var(--faint); }
  :root[data-edges="soft"] #toc a { border-left-color: var(--faint); }
  @media (max-width: 760px) {
    :root[data-edges="soft"] #mobileBar { border-bottom-color: transparent; background-image: linear-gradient(to top, var(--rule), transparent var(--fade)); }
    :root[data-edges="soft"] #mobileBar button { border-radius: 10px; }
    :root[data-edges="soft"] #composer { border-color: transparent; border-radius: 18px 18px 0 0; box-shadow: none; background-image: linear-gradient(to bottom, var(--rule), transparent var(--fade)); }
    :root[data-edges="soft"] .md table.wide tr { border-color: transparent; border-radius: 12px; box-shadow: var(--ring-small); overflow: hidden; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="mobileBar"><button id="mFiles" aria-label="Files and outline">☰ Files</button><b><span class="dot"></span><span id="mTitle"></span></b><button id="mTools" hidden aria-pressed="false" aria-label="This PDF's controls: size, theme, reader, keep" title="This PDF's controls: size, theme, reader, keep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button><button id="mNotes">Notes</button></header>
  <button id="sideEdge" aria-label="Show sidebar" title="Sidebar (hover to peek, click to keep open)">›</button>

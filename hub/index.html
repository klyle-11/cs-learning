<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<style>
  :root {
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --body: var(--serif);
    --head: var(--sans);
    --paper: #fdfcf7;
    --shade: #f4f1e8;
    --ink: #1d1b16;
    --muted: #6f6a5f;
    --rule: #ddd8ca;
    --accent: #8c2f1b;
    --mark: #fbeeb0;
    --reply: #eef3ea;
    --field: #fff;
    --quote: #3b382f;
    --c-kw: #8c2f1b; --c-str: #2f6f4f; --c-com: #8a8473; --c-num: #a05a00; --c-fn: #1f4e8c; --c-type: #6b3fa0;
  }
  /* Themes. Each one only redefines the colour tokens above. */
  :root[data-theme="selenized"] { /* Selenized Light */
    --paper: #fbf3db; --shade: #ece3cc; --ink: #3a4d53; --muted: #53676d; --rule: #d5cdb6;
    --accent: #0072d4; --mark: #f1dc9a; --reply: #e6ebcb; --field: #fffaea; --quote: #53676d;
    --c-kw: #8762c6; --c-str: #009c8f; --c-com: #909995; --c-num: #c25d1e; --c-fn: #0072d4; --c-type: #ad8900;
  }
  :root[data-theme="lime"] { /* pale lime, a touch cool; golden-sepia ink and accents */
    --paper: #eff9e9; --shade: #e1f0d9; --ink: #4d3c1f; --muted: #7b6535; --rule: #c6dbbb;
    --accent: #8f6a14; --mark: #f6e58d; --reply: #d6ead0; --field: #f9fdf5; --quote: #5f4c2a;
    --c-kw: #8a3b6b; --c-str: #2e7d4f; --c-com: #66725a; --c-num: #a35a00; --c-fn: #1e5fa8; --c-type: #6b3fa0;
  }
  :root[data-theme="sky"] { /* pale sky blue, a touch warm; golden-sepia ink and accents */
    --paper: #f1f6f9; --shade: #e4edf3; --ink: #4d3c1f; --muted: #7b6535; --rule: #cbd9e3;
    --accent: #8f6a14; --mark: #fbe9a6; --reply: #e2ede4; --field: #fcfdfe; --quote: #5f4c2a;
    --c-kw: #8a3fa0; --c-str: #1f7a5c; --c-com: #5d7082; --c-num: #b25a00; --c-fn: #1668a8; --c-type: #5a4fc0;
  }
  :root[data-theme="eva"] { /* Eva Dark */
    color-scheme: dark;
    --paper: #282c34; --shade: #21252b; --ink: #b7c5d3; --muted: #8391a2; --rule: #3b414d;
    --accent: #cf68e1; --mark: #e4bf7f; --reply: #2c3a3a; --field: #1e2228; --quote: #a3b1c0;
    --c-kw: #cf68e1; --c-str: #98c379; --c-com: #6b7686; --c-num: #ff9070; --c-fn: #6495ee; --c-type: #e4bf7f;
  }
  :root[data-theme="triple-m"] {
    color-scheme: dark;
    --paper: #1d163e; --shade: #271e54; --ink: #fffffc; --muted: #b3abd8; --rule: #3e3372;
    --accent: #ff8fc7; --mark: #ffd166; --reply: #2a2563; --field: #150f31; --quote: #dcd7f2;
    --c-kw: #ff8fc7; --c-str: #9be7c4; --c-com: #8d84b8; --c-num: #ffd166; --c-fn: #8ec5ff; --c-type: #c9a7ff;
  }
  :root[data-font="sans"] { --body: var(--sans); --head: var(--serif); }

  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font: var(--fs, 18px)/1.65 var(--body); }

  /* Keyboard focus is always obvious. */
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  [role="button"] { cursor: pointer; }

  /* Roomier text: more space between lines, words and paragraphs. */
  body.roomy .md { line-height: 1.95; letter-spacing: .015em; word-spacing: .08em; }
  body.roomy .md p, body.roomy .md li { margin-bottom: 1.3em; }

  /* Reading focus: everything but the block being read is faded. */
  body.focus .md > * { opacity: .3; }
  body.focus .md > .here, body.focus .md > .editFront { opacity: 1; }
  body.focus .md > .here { box-shadow: -12px 0 0 0 var(--paper), -16px 0 0 0 var(--accent); }
  @media (prefers-reduced-motion: no-preference) { body.focus .md > * { transition: opacity .12s; } }
  a { color: var(--accent); }
  button, textarea { font: inherit; color: inherit; }
  #theme { font: 13px var(--head); color: inherit; background: var(--paper); border: 1px solid var(--rule); padding: 1px 4px; margin: 0 4px 8px 0; }
  button { background: none; border: 1px solid var(--rule); padding: 1px 8px; cursor: pointer; font: 13px var(--head); }

  #app { display: grid; grid-template-columns: 250px minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }
  #mobileBar, #backdrop { display: none; }

  /* right column: the second document (when split) stacked with the notes */
  #right { position: relative; width: var(--right-w, 300px); display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--rule); }
  #right.notes-top { flex-direction: column-reverse; }
  body.no-right #right { display: none; }
  #rightGrip { position: absolute; left: -4px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3; }
  #rightDoc { flex: 1 1 0; min-height: 0; display: flex; }
  #hGrip { flex: 0 0 7px; cursor: row-resize; border-top: 1px solid var(--rule); }
  #right.notes-top #hGrip { border-top: 0; border-bottom: 1px solid var(--rule); }
  #rightGrip:hover, #hGrip:hover { background: var(--rule); }
  #right.no-doc #rightDoc, #right.no-doc #hGrip, #right.no-notes #hGrip, #right.no-notes #notes { display: none; }
  .dragging { user-select: none; }

  /* sidebar: title, file browser, outline of the active document */
  /* sidebar tucked away: it slides back when the left edge is hovered or focused */
  body.side-closed #app { grid-template-columns: minmax(0, 1fr) auto; }
  body.side-closed #side { position: fixed; z-index: 6; left: 0; top: 0; bottom: 0; width: 264px; background: var(--paper); box-shadow: 4px 0 16px rgba(0, 0, 0, .18); transform: translateX(-105%); }
  body.side-closed.side-peek #side, body.side-closed #side:focus-within { transform: none; }
  #sideEdge { display: none; position: fixed; z-index: 5; left: 0; top: 0; bottom: 0; width: 14px; padding: 0; border: 0; border-right: 1px solid var(--rule); background: var(--shade); color: var(--muted); font-size: 11px; }
  body.side-closed #sideEdge { display: block; }
  body.side-closed #work { padding-left: 14px; }
  @media (prefers-reduced-motion: no-preference) { body.side-closed #side { transition: transform .12s; } }
  #workspace { font: 13px var(--head); color: inherit; background: var(--paper); border: 1px solid var(--rule); padding: 1px 4px; max-width: 100%; }
  #wsRow { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 10px 8px 0; }
  #upload { margin: 0 10px 8px 0; padding: 8px; border: 1px solid var(--rule); background: var(--shade); font-size: 13px; }
  #upload[hidden] { display: none; }
  #upload p { margin: 0 0 6px; }
  #upload button { display: block; width: 100%; margin-top: 4px; text-align: left; padding: 4px 8px; background: var(--paper); }
  #sideTools { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 10px 8px 0; }
  #sideTools button, #sideTools select { margin: 0 !important; }
  #sideTools button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #side { display: flex; flex-direction: column; min-height: 0; padding: 14px 0 0 14px; font: 14px/1.4 var(--head); border-right: 1px solid var(--rule); }
  #hubTitle { font-size: 17px; font-weight: 700; margin: 0 14px 8px 0; padding: 2px 4px; margin-left: -4px; cursor: text; }
  #hubTitle:hover, #hubTitle:focus { outline: 1px dashed var(--rule); }
  #sideTools button { margin: 0 4px 8px 0; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 0 4px; border-top: 1px solid var(--rule); }
  #tree, #toc { flex: 1 1 50%; min-height: 0; overflow-y: auto; padding: 0 8px 12px 0; }
  #tree summary { cursor: pointer; padding: 2px 0; font-weight: 600; }
  #tree .kids { padding-left: 14px; }
  .file { display: flex; align-items: baseline; gap: 6px; padding: 2px 4px; cursor: pointer; color: var(--muted); }
  .file span.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file.open { color: var(--ink); }
  .file.active { color: var(--accent); background: var(--shade); }
  .file small { color: var(--muted); }
  .file button { visibility: hidden; border: 0; padding: 0 2px; color: var(--accent); font-size: 11px; }
  .file:hover button, .file:focus-within button { visibility: visible; }
  .file .plus { font-size: 15px; font-weight: 700; }
  #toc a { display: block; padding: 3px 0 3px 8px; color: var(--muted); text-decoration: none; border-left: 2px solid transparent; }
  #toc a.l1 { color: var(--ink); font-weight: 600; margin-top: 8px; }
  #toc a.l3 { padding-left: 22px; font-size: 13px; }
  #toc a.active { color: var(--accent); border-left-color: var(--accent); }

  /* workspace: one or two panes, each with tabs along the top */
  #work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #panes { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  /* how far through the document the reader is */
  .progress { flex: none; height: 3px; background: var(--shade); }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }
  .pane.active .tabs { box-shadow: inset 0 3px 0 var(--accent); }
  .dragging iframe { pointer-events: none; }
  .tabs { display: flex; align-items: stretch; background: var(--shade); border-bottom: 1px solid var(--rule); font: 13px var(--head); overflow-x: auto; flex: none; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 7px 8px 6px 12px; border-right: 1px solid var(--rule); border-top: 2px solid transparent; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .tab span { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .tab.preview span { font-style: italic; }
  .tab.active { background: var(--paper); color: var(--ink); }
  .pane.active .tab.active { border-top-color: var(--accent); }
  .tab button, .tabs > button { border: 0; padding: 0 4px; color: var(--muted); }
  .tabs > button + button { margin-left: 0 !important; }
  .tabs > button[aria-pressed="true"] { color: var(--accent); }
  .tabs > button { margin-left: auto; padding: 0 10px; white-space: nowrap; flex: none; position: sticky; right: 0; background: var(--shade); }
  .tab { flex: none; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* a document scrolls up and down only; wide tables and code scroll inside themselves */
  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-x: none; padding: 0 32px; }
  .body iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .empty { color: var(--muted); font: 14px var(--head); padding: 24px 32px; }

  /* contents dial: shown when the sidebar is not. A bare icon over the page;
     it opens a small scrolling list where the centred heading is the big one. */
  #work { position: relative; }
  #tocBtn { display: none; position: absolute; z-index: 4; top: 44px; right: 14px; width: 34px; height: 34px; padding: 6px; border: 0; background: transparent; color: var(--muted); }
  #tocBtn svg { display: block; width: 100%; height: 100%; }
  #tocBtn[aria-expanded="true"] { color: var(--accent); }
  body.side-closed #tocBtn { display: block; }
  #dial { position: absolute; z-index: 4; top: 82px; right: 10px; width: min(72%, 300px); height: 46vh; overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y mandatory; padding: calc(23vh - 13px) 0; background: color-mix(in srgb, var(--paper) 93%, transparent); border: 1px solid var(--rule); font-family: var(--head); }
  #dial[hidden] { display: none; }
  #dial .d { height: 26px; line-height: 26px; padding: 0 10px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; scroll-snap-align: center; cursor: pointer; }
  #dial .d.l2 { padding-left: 20px; }
  #dial .d.l3 { padding-left: 30px; }
  #dial .d.sel { font-size: 16px; font-weight: 700; color: var(--accent); padding-left: 10px; border-left: 3px solid var(--accent); }
  #dial .none { padding: 0 10px; font-size: 12px; color: var(--muted); }

  /* connection and device-copy status */
  #net { margin: 0 10px 10px 0; padding: 6px 8px; border: 1px solid var(--rule); font-size: 12.5px; line-height: 1.45; }
  #net b { font-weight: 600; }
  #net .dot, #mobileBar .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3f8f4f; margin-right: 6px; }
  body.offline #net .dot, body.offline #mobileBar .dot { background: #c0392b; }
  body.offline #net { border-color: #c0392b; }
  #net .sub { color: var(--muted); }
  #net button { border: 0; padding: 0; color: var(--accent); font-size: 12.5px; text-decoration: underline; }
  #net .say { color: #c0392b; }
  .file .st { visibility: visible !important; display: inline-block !important; border: 0; padding: 0 2px; font-size: 11px; color: var(--muted); }
  .file .st.kept { color: #3f8f4f; }
  .file .st.wait { color: #b9770e; font-weight: 700; }
  #side.drop { outline: 3px dashed var(--accent); outline-offset: -3px; }

  /* music player: one player for the whole reader, with the playlist as a document */
  .player { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 80px; font: 14px/1.4 var(--head); }
  .player .now { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  .player .where { color: var(--muted); margin-bottom: 12px; }
  .pl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .pl-row button { padding: 6px 14px; font-size: 14px; }
  .pl-seek { flex: 1; min-width: 140px; accent-color: var(--accent); }
  .pl-vol { width: 110px; accent-color: var(--accent); }
  .pl-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .player h5 { margin: 18px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .track { display: flex; gap: 10px; align-items: baseline; padding: 6px 6px; border-top: 1px solid var(--rule); cursor: pointer; }
  .track.cur { color: var(--accent); font-weight: 700; background: var(--shade); }
  .track.gone { color: var(--muted); cursor: default; }
  .track span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track .st { border: 0; padding: 0 4px; font-size: 12px; color: var(--muted); }
  .track .st.kept { color: #3f8f4f; }
  #mini { margin: 0 10px 10px 0; padding: 6px 8px; border: 1px solid var(--rule); font-size: 12.5px; }
  #mini[hidden] { display: none; }
  #mini a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; text-decoration: underline; margin-bottom: 4px; }
  #mini button { margin-right: 4px; }

  /* picture, video and sound viewer */
  .viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .viewbar { flex: none; display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--rule); font: 13px var(--head); }
  .viewbar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .viewbar a { color: var(--accent); white-space: nowrap; }
  .stage { flex: 1; min-height: 0; overflow: auto; display: flex; background: var(--shade); overscroll-behavior: contain; }
  .stage img, .stage video, .stage audio { display: block; margin: auto; }
  .stage.fit img, .stage.fit video { max-width: 100%; max-height: 100%; object-fit: contain; }
  .stage.fit img { cursor: zoom-in; }
  .stage:not(.fit) img { cursor: zoom-out; max-width: none; }
  .stage video { background: #000; }
  .stage audio { width: min(90%, 480px); }
  .md img { cursor: zoom-in; }

  /* a rendered document */
  .md { max-width: 40em; margin: 0 auto; padding: 16px 0 120px; }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--head); line-height: 1.25; scroll-margin-top: 12px; }
  .md h1 { font-size: 1.7em; margin-top: 1.6em; border-bottom: 1px solid var(--rule); padding-bottom: .2em; }
  .md h2 { font-size: 1.25em; margin-top: 1.8em; }
  .md blockquote { margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--rule); color: var(--quote); }
  .md pre { background: var(--shade); padding: 12px; overflow-x: auto; font-size: 14px; line-height: 1.45; }
  .md code { font-family: Menlo, Consolas, monospace; font-size: .86em; }
  /* code colours, by token; the values come from the theme */
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--c-kw); }
  .hljs-string, .hljs-regexp, .hljs-char, .hljs-meta .hljs-string { color: var(--c-str); }
  .hljs-comment, .hljs-quote { color: var(--c-com); font-style: italic; }
  .hljs-number, .hljs-symbol, .hljs-meta, .hljs-attr, .hljs-variable { color: var(--c-num); }
  .hljs-title, .hljs-section, .hljs-name { color: var(--c-fn); }
  .hljs-type, .hljs-built_in, .hljs-class .hljs-title { color: var(--c-type); }
  .md { overflow-wrap: anywhere; }
  .md table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .92em; }
  .md td, .md th { border: 1px solid var(--rule); padding: 6px 10px; vertical-align: top; }
  .md img { max-width: 100%; }
  .md hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
  .md summary { cursor: pointer; color: var(--accent); font: 14px var(--head); }
  mark { background: var(--mark); color: #1d1b16; cursor: pointer; }
  mark.flash, .note.flash { outline: 2px solid var(--accent); }
  .note.on { background: var(--shade); }
  /* highlight flyout and type legend */
  #flyout { position: fixed; z-index: 5; display: flex; gap: 7px; align-items: center; padding: 6px 8px; background: var(--field); border: 1px solid var(--rule); box-shadow: 0 2px 8px rgba(0, 0, 0, .14); }
  #flyout[hidden] { display: none; }
  #flyout button:not(.sw) { border: 0; padding: 0 2px; color: var(--accent); font-size: 12px; }
  .sw { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .25); padding: 0; flex: none; vertical-align: -3px; }
  .sw.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  mark.on { box-shadow: 0 0 0 2px var(--accent); }
  #types { margin-bottom: 16px; }
  .type { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .type input { width: 20px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
  .type span { flex: 1; padding: 1px 3px; cursor: text; }
  .type span:hover, .type span:focus { outline: 1px dashed var(--rule); }
  .type.cur span { font-weight: 600; }
  #types > button { margin-top: 6px; border: 0; padding: 0; color: var(--accent); font-size: 12px; }
  .editFront { float: right; margin-top: 8px; }
  .frontEditor { max-width: 720px; margin: 0 auto; padding: 16px 0; }
  .frontEditor textarea { width: 100%; min-height: 55vh; padding: 12px; border: 1px solid var(--rule); background: var(--field); font: 14px/1.5 Menlo, Consolas, monospace; }
  .frontEditor button { margin: 8px 8px 0 0; padding: 4px 12px; }
  .frontEditor p { font: 13px var(--head); color: var(--muted); }

  /* notes: a separate layer beside the documents */
  #notes { flex: 0 0 var(--notes-h, 40%); min-height: 0; overflow-y: auto; padding: 14px; font: 14px/1.4 var(--head); }
  #right.no-doc #notes { flex: 1 1 0; }
  #notes .flip { float: right; border: 0; padding: 0; color: var(--accent); font-size: 12px; }
  #notes h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  #notes .empty { padding: 0; }
  .note { border-top: 1px solid var(--rule); padding: 10px 0; }
  .note .quote { font-family: var(--body); font-style: italic; color: var(--muted); border-left: 3px solid var(--mark); padding-left: 8px; margin-bottom: 6px; cursor: pointer; }
  .note .text { font-family: var(--body); font-size: 15px; white-space: pre-wrap; }
  .note .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .note .meta button { border: 0; padding: 0; margin-left: 8px; color: var(--accent); font-size: 12px; }
  .note .reply { background: var(--reply); padding: 8px 10px; margin-top: 8px; font-family: var(--body); font-size: 15px; }
  .note .reply p { margin: 0 0 .5em; }

  /* composer: along the bottom, like talking to the open document */
  #composer { flex: none; border-top: 1px solid var(--rule); padding: 8px 32px 12px; }
  #composer .inner { max-width: 720px; margin: 0 auto; }
  #grip { display: block; width: 64px; height: 16px; margin: -4px auto 2px; padding: 0; border: 0; cursor: ns-resize; touch-action: none; }
  #grip::before { content: ''; display: block; width: 40px; height: 4px; margin: 6px auto; border-radius: 2px; background: var(--rule); }
  #grip:hover::before, #grip:focus-visible::before { background: var(--muted); }
  #context { font: 13px var(--head); color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #context b { color: var(--ink); font-weight: 600; }
  #context button { border: 0; padding: 0 4px; color: var(--accent); }
  #input { display: block; width: 100%; height: 56px; resize: none; padding: 8px 10px; border: 1px solid var(--rule); background: var(--field); font: 16px/1.4 var(--body); }

  /* ---- phone: one column; files and notes become slide-over drawers ---- */
  @media (max-width: 760px) {
    #app { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: auto minmax(0, 1fr); }
    #mobileBar { display: flex; grid-row: 1; align-items: center; gap: 8px; padding: 6px 8px; background: var(--shade); border-bottom: 1px solid var(--rule); font: 14px var(--head); }
    #mobileBar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
    #mobileBar button { padding: 8px 12px; font-size: 14px; background: var(--paper); }
    #work { grid-row: 2; padding-left: 0 !important; }
    #tocBtn { display: block; right: 6px; }
    #dial { right: 6px; }

    #side { position: fixed; z-index: 8; left: 0; top: 0; bottom: 0; width: min(86vw, 330px); background: var(--paper); box-shadow: 4px 0 16px rgba(0, 0, 0, .25); transform: translateX(-105%) !important; font-size: 15px; }
    body.m-side #side { transform: none !important; visibility: visible; }
    #side, #right { visibility: hidden; }   /* closed drawers take no part in scrolling */
    #app { overflow: hidden; }
    #right { display: flex !important; position: fixed; z-index: 8; right: 0; top: 0; bottom: 0; width: min(92vw, 430px) !important; background: var(--paper); box-shadow: -4px 0 16px rgba(0, 0, 0, .25); transform: translateX(105%); }
    body.m-right #right { transform: none; visibility: visible; }
    #right.no-notes #notes { display: block; flex: 1 1 0; }
    body.m-side #backdrop, body.m-right #backdrop { display: block; position: fixed; inset: 0; z-index: 7; background: rgba(0, 0, 0, .4); }
    #sideEdge, #sideToggle, #notesToggle, #rightGrip, .tabs > button:not(.keep), .file .sideBtn { display: none !important; }
    .file .plus { visibility: visible; font-size: 22px; line-height: 1; padding: 0 10px; }

    .file { padding: 8px 6px; }
    #tree summary { padding: 7px 0; }
    #toc a { padding: 7px 0 7px 8px; }
    .scroller { padding: 0 16px; }
    .md { padding: 8px 0 60px; }
    .md h1 { font-size: 1.45em; }
    .tab { padding: 9px 8px 8px 12px; }

    /* the input sits in the lower part of the screen and grows while typing */
    #composer { padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); }
    #input { height: 46px; }
    #flyout { gap: 12px; padding: 9px 12px; }
    #flyout .sw { width: 28px; height: 28px; }
    #flyout button:not(.sw) { font-size: 15px; padding: 4px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="mobileBar"><button id="mFiles" aria-label="Files and outline">☰ Files</button><b><span class="dot"></span><span id="mTitle"></span></b><button id="mNotes">Notes</button></header>
  <button id="sideEdge" aria-label="Show sidebar" title="Sidebar (hover to peek, click to keep open)">›</button>
  <nav id="side" aria-label="Files and outline">

    <div id="sideTools"><select id="theme" title="Theme"><option value="plain">Plain</option><option value="selenized">Selenized Light</option><option value="lime">Pale Lime</option><option value="sky">Pale Sky</option><option value="eva">Eva Dark</option><option value="triple-m">Triple-M</option></select><button id="fontToggle"></button><button id="notesToggle"></button><button id="sideToggle" title="Tuck the sidebar away; it returns when you hover the left edge"></button><button id="focusToggle" title="Fade everything except the paragraph you are reading">reading focus</button><button id="roomyToggle" title="More space between lines and words">roomy text</button><button id="smaller" aria-label="Smaller text" title="Smaller text">A−</button><button id="bigger" aria-label="Larger text" title="Larger text">A+</button></div>
    <div id="wsRow"><select id="workspace" title="Workspace" hidden></select><button id="addBtn" title="Add files from this device. If the server is out of reach they are held here and sent later.">add files…</button><input id="fileInput" type="file" multiple hidden><button id="uploadBtn" title="Bring a folder from your computer into the hub">upload a folder…</button><input id="folderInput" type="file" webkitdirectory multiple hidden></div>
    <div id="upload" hidden role="status"></div>
    <div id="net" role="status" aria-live="polite"></div>
    <div id="mini" hidden></div>
    <div class="label">Files</div>
    <div id="tree"></div>
    <div class="label">Outline</div>
    <div id="toc"></div>
  </nav>
  <div id="work" role="main">
    <div id="panes"></div>
    <button id="tocBtn" type="button" aria-label="Contents of this document" aria-expanded="false" title="Contents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M3 5h3M9 5h12M3 12h3M9 12h9M3 19h3M9 19h6"/></svg></button>
    <div id="dial" hidden></div>
    <form id="composer">
      <div class="inner">
        <button type="button" id="grip" aria-label="Make the note box taller or shorter" title="Drag up to make the note box taller, or press to switch between small and tall"></button>
        <div id="context"></div>
        <textarea id="input" placeholder="Write a note or a question…  (Enter to save, Shift+Enter for a new line)"></textarea>
      </div>
    </form>
  </div>
  <div id="right">
    <div id="rightGrip" title="Drag to resize"></div>
    <div id="rightDoc"></div>
    <div id="hGrip" title="Drag to resize"></div>

  </div>
</div>
<div id="backdrop"></div>
<div id="flyout" hidden></div>

<script src="/vendor/marked.js"></script>
<script src="/vendor/highlight.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const panesEl = $('panes'), treeEl = $('tree'), tocEl = $('toc'), notesEl = $('notes'), input = $('input'), titleEl = $('hubTitle');

let docs = [], config = { title: '' }, notes = [], pendingQuote = '', pendingHead = null, activeHl = null, editing = false;
// Layout: one or two panes, each with its open tabs. Saved per folder.
// Pane 0 is the main reader; pane 1, when present, sits in the right column above or below the notes.
let state = { panes: [{ tabs: [], active: null, preview: null }], active: 0, notesOpen: true, sideOpen: true, notesW: 300, notesH: 40, notesTop: false, closed: [] };
const views = [];            // DOM for each pane: { root, tabsEl, body, scroller, article, frame, surface, heads, cur }
                             // surface: the element highlights are drawn in (the article, or a framed page's body)
const scrollMem = new Map(); // "pane:path" -> scrollTop

// Every request goes through call(), which is how the page knows whether the
// server is in reach. A failed request throws an error marked `offline`.
async function call(url, opts = {}) {
  try {
    const r = await fetch(url, opts);
    setOnline(true);
    return r;
  } catch {
    setOnline(false);
    throw Object.assign(new Error('The server is not reachable.'), { offline: true, method: opts.method || 'GET' });
  }
}
const api = (url, method = 'GET', body) =>
  call(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) })
    .then((r) => ((r.headers.get('content-type') || '').includes('json') ? r.json() : r.text()));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const save = () => store.set('layout:' + config.root, state);
const docOf = (path) => docs.find((d) => d.path === path);
const isHtml = (path) => /\.html?$/.test(path);
const isImage = (path) => /\.(png|jpe?g|gif|webp|svg)$/i.test(path);
const isVideo = (path) => /\.(mp4|m4v|mov|webm|ogv)$/i.test(path);
const isAudio = (path) => /\.(mp3|m4a|wav|ogg)$/i.test(path);
const isMedia = (path) => isImage(path) || isVideo(path) || isAudio(path);
const rawUrl = (path) => '/raw/' + path.split('/').map(encodeURIComponent).join('/');
const activeDoc = () => state.panes[state.active]?.active || null;
const types = () => config.highlights || [];
const typeOf = (id) => types().find((t) => t.id === id) || types()[0];
const curType = () => typeOf(store.get('hlType'));   // the colour in use until changed
const hlNote = () => notes.find((n) => n.id === activeHl) || null;
const resolve = (base, rel) => decodeURIComponent(new URL(rel, 'http://x/' + base).pathname.slice(1));

// ---- font switcher, notes panel toggle ------------------------------------
function setFont(f) {
  document.documentElement.dataset.font = f;
  $('fontToggle').textContent = f === 'serif' ? 'Aa sans body' : 'Aa serif body';
  store.set('font', f);
}
$('fontToggle').onclick = () => setFont(document.documentElement.dataset.font === 'serif' ? 'sans' : 'serif');
setFont(store.get('font') || 'serif');

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').value = t;
  store.set('theme', t);
}
$('theme').onchange = () => setTheme($('theme').value);
setTheme(store.get('theme') || 'plain');

// Reading aids: text size, roomier spacing, and a focus mode that fades
// everything except the block being read.
const view = { fs: 18, roomy: false, focus: false, ...(store.get('view') || {}) };
function applyView() {
  document.documentElement.style.setProperty('--fs', view.fs + 'px');
  document.body.classList.toggle('roomy', view.roomy);
  document.body.classList.toggle('focus', view.focus);
  $('roomyToggle').setAttribute('aria-pressed', view.roomy);
  $('focusToggle').setAttribute('aria-pressed', view.focus);
  store.set('view', view);
}
$('roomyToggle').onclick = () => { view.roomy = !view.roomy; applyView(); };
$('focusToggle').onclick = () => { view.focus = !view.focus; applyView(); };
$('smaller').onclick = () => { view.fs = Math.max(14, view.fs - 1); applyView(); };
$('bigger').onclick = () => { view.fs = Math.min(28, view.fs + 1); applyView(); };
applyView();

// The note box keeps its height. The handle above it resizes it: drag, or
// press to switch between small and about a quarter of the screen.
function setInputH(px) {
  const h = Math.round(Math.max(46, Math.min(px, innerHeight * 0.6)));
  input.style.height = h + 'px';
  view.inputH = h;
  store.set('view', view);
}
if (view.inputH) input.style.height = view.inputH + 'px';
const toggleInputH = () => setInputH(input.offsetHeight > 110 ? 46 : innerHeight * 0.25);
$('grip').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const grip = $('grip'), y0 = e.clientY, h0 = input.offsetHeight;
  let moved = false;
  grip.setPointerCapture(e.pointerId);
  const move = (ev) => { if (Math.abs(ev.clientY - y0) > 4) moved = true; if (moved) setInputH(h0 + y0 - ev.clientY); };
  const up = () => { grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); if (!moved) toggleInputH(); };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up);
});
$('grip').addEventListener('click', (e) => { if (e.detail === 0) toggleInputH(); }); // keyboard

// The block being read: under the pointer, or at the reading line after a scroll.
function setHere(pane, node) {
  const v = views[pane];
  while (node && node.parentElement !== v.article) node = node.parentElement;
  if (!node || node === v.here || node.classList.contains('editFront')) return;
  v.here?.classList.remove('here');
  v.here = node;
  node.classList.add('here');
}

// Sidebar: open, or tucked away and shown while the left edge is hovered.
function setSideOpen(open) {
  state.sideOpen = open;
  document.body.classList.toggle('side-closed', !open);
  document.body.classList.remove('side-peek');
  if (!open) document.activeElement?.blur();
  $('sideToggle').textContent = open ? 'hide sidebar' : 'keep sidebar open';
}
$('sideToggle').onclick = () => { setSideOpen(!state.sideOpen); save(); };
$('sideEdge').onclick = () => { setSideOpen(true); save(); };
$('sideEdge').addEventListener('mouseenter', () => document.body.classList.add('side-peek'));
$('side').addEventListener('mouseleave', () => document.body.classList.remove('side-peek'));

// Rows and tabs act as buttons from the keyboard too.
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role="button"]')) { e.preventDefault(); e.target.click(); }
});

function setNotesOpen(open) {
  state.notesOpen = open;
  $('notesToggle').textContent = open ? 'hide notes' : 'show notes';
  applyLayout();
}
// Size and arrange the right column from the saved layout.
function applyLayout() {
  const split = state.panes.length > 1, r = $('right');
  document.body.classList.toggle('no-right', !split && !state.notesOpen);
  r.classList.toggle('no-doc', !split);
  r.classList.toggle('no-notes', !state.notesOpen);
  r.classList.toggle('notes-top', state.notesTop);
  // One width for the column, whether or not it holds a document.
  const w = Math.max(240, Math.min(state.notesW, innerWidth * 0.6));
  r.style.setProperty('--right-w', Math.round(w) + 'px');
  r.style.setProperty('--notes-h', state.notesH + '%');
}
window.addEventListener('resize', applyLayout);
function dragGrip(grip, onMove) {
  grip.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    const move = (ev) => { onMove(ev); applyLayout(); };
    const up = () => {
      document.body.classList.remove('dragging');
      grip.removeEventListener('pointermove', move);
      grip.removeEventListener('pointerup', up);
      save();
    };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
  });
}
dragGrip($('rightGrip'), (ev) => {
  state.notesW = Math.round(Math.max(240, Math.min(innerWidth - ev.clientX, innerWidth * 0.6)));
});
dragGrip($('hGrip'), (ev) => {
  const b = $('right').getBoundingClientRect();
  const f = state.notesTop ? (ev.clientY - b.top) / b.height : (b.bottom - ev.clientY) / b.height;
  state.notesH = Math.round(Math.max(15, Math.min(85, f * 100)));
});
$('notesToggle').onclick = () => { setNotesOpen(!state.notesOpen); save(); };

// ---- title (FRONTPAGE.md heading, or hub.json) -----------------------------
function setTabTitle() {
  const d = docOf(activeDoc());
  document.title = (d && !d.front ? d.title + ' · ' : '') + config.title;
}
async function loadConfig() {
  // Without the server, fall back to the settings seen last time.
  try { config = await api('/api/config'); store.set('hub:config', config); }
  catch (e) { const last = store.get('hub:config'); if (!last) throw e; config = last; }
  if (document.activeElement !== titleEl) titleEl.textContent = config.title;
  setTabTitle();
}
titleEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
  if (e.key === 'Escape') { titleEl.textContent = config.title; titleEl.blur(); }
});
titleEl.addEventListener('blur', async () => {
  const t = titleEl.textContent.trim();
  if (!t || t === config.title) return (titleEl.textContent = config.title);
  config = await api('/api/config', 'PUT', { title: t });
  titleEl.textContent = config.title;
  setTabTitle();
});

// ---- workspaces and folder upload ---------------------------------------------
async function loadWorkspaces() {
  let list;
  try { list = await api('/api/workspaces'); } catch { return; }
  const sel = $('workspace');
  sel.innerHTML = '';
  for (const w of list) sel.append(new Option((w.home ? '' : '↳ ') + w.name, w.root, w.current, w.current));
  sel.hidden = list.length < 2;
  sel.onchange = async () => { await api('/api/workspace', 'POST', { root: sel.value }); location.href = '/'; };
}
$('uploadBtn').onclick = () => $('folderInput').click();
$('folderInput').onchange = (e) => {
  const files = [...e.target.files].map((file) => ({ rel: file.webkitRelativePath || file.name, file }));
  e.target.value = '';
  if (files.length) offerUpload(files);
};

// After a folder is picked: say what was found, and ask where it should go.
function offerUpload(files) {
  const box = $('upload'), folder = files[0].rel.split('/')[0];
  const ok = files.filter(({ rel, file }) => !rel.split('/').some((x) => x.startsWith('.') || x === 'node_modules') && file.size <= 50 * 1024 * 1024);
  box.hidden = false;
  box.replaceChildren(el('p', '', `“${folder}”: ${ok.length} file${ok.length === 1 ? '' : 's'}` + (ok.length < files.length ? ` (${files.length - ok.length} hidden or oversized files left out)` : '')));
  const add = el('button', '', `Add to this workspace, as the folder “${folder}”`);
  add.onclick = () => runUpload(ok, null, folder);
  const fresh = el('button', '', 'Open as its own workspace, in place of this one');
  fresh.title = 'Nothing is deleted: the current workspace stays on disk and in the workspace menu';
  fresh.onclick = () => runUpload(ok, folder, folder);
  const cancel = el('button', '', 'Cancel');
  cancel.onclick = () => { box.hidden = true; };
  box.append(add, fresh, cancel);
  add.focus();
}

// Send the files one at a time. `workspace` set: they become a workspace of
// their own (the top folder name is dropped); otherwise they join this one.
async function runUpload(files, workspace, folder) {
  const box = $('upload'), line = el('p');
  box.replaceChildren(line);
  let saved = 0, skipped = 0, failed = 0, root = '';
  for (const [i, { rel, file }] of files.entries()) {
    line.textContent = `Uploading ${i + 1} of ${files.length}…`;
    const path = workspace ? rel.split('/').slice(1).join('/') : rel;
    const q = '?path=' + encodeURIComponent(path) + (workspace ? '&workspace=' + encodeURIComponent(workspace) : '');
    try {
      const r = await (await fetch('/api/upload' + q, { method: 'POST', body: file })).json();
      if (r.saved) { saved++; root = r.root; } else if (r.skipped) skipped++; else failed++;
    } catch { failed++; }
  }
  line.textContent = `${saved} added` + (skipped ? `, ${skipped} already here and left alone` : '') + (failed ? `, ${failed} failed` : '') + '.';
  const done = el('button', '', 'OK');
  done.onclick = () => { box.hidden = true; };
  box.append(done);
  if (workspace && root) {
    await api('/api/workspace', 'POST', { root });
    location.href = '/';
  } else {
    await loadDocs();
    done.focus();
  }
}

// ---- phone: drawers for the sidebar and the notes -------------------------------
const phone = matchMedia('(max-width: 760px)'), touch = matchMedia('(pointer: coarse)');
function drawer(name) {
  document.body.classList.toggle('m-side', name === 'side' && !document.body.classList.contains('m-side'));
  document.body.classList.toggle('m-right', name === 'right' && !document.body.classList.contains('m-right'));
}
$('mFiles').onclick = () => drawer('side');
$('mNotes').onclick = () => drawer('right');
$('backdrop').onclick = () => drawer(null);

// ---- working without the server ------------------------------------------------
// Documents you open are copied into this browser's own storage, so they still
// open when the server is out of reach. Notes and highlights made meanwhile, and
// files added from this device, wait in an outbox and are sent when it answers.
const net = { online: true, said: '' };
let outbox = [], pendingFiles = [], kept = new Set(), flushing = false;
const keyOf = (path) => config.root + '|' + path;
const isPending = (path) => pendingFiles.some((f) => f.path === path);
const canKeep = (path) => !isMedia(path) || isAudio(path);   // text documents, HTML pages and music
function saveLocal() {
  store.set('notes:' + config.root, notes);
  store.set('outbox:' + config.root, outbox);
  store.set('pending:' + config.root, pendingFiles);
}

// A very small wrapper over IndexedDB. If the browser refuses storage, every
// call quietly does nothing and the reader simply keeps no copies.
const idb = {
  open() {
    return (this.db ||= new Promise((resolve) => {
      try {
        const req = indexedDB.open('hub', 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('docs', { keyPath: 'key' }); req.result.createObjectStore('files', { keyPath: 'key' }); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch { resolve(null); }
    }));
  },
  async run(name, mode, fn) {
    const db = await this.open();
    if (!db) return null;
    return new Promise((resolve) => {
      const tx = db.transaction(name, mode), req = fn(tx.objectStore(name));
      tx.oncomplete = () => resolve(req ? req.result : null);
      tx.onerror = tx.onabort = () => resolve(null);
    });
  },
  get: (name, key) => idb.run(name, 'readonly', (s) => s.get(key)),
  put: (name, value) => idb.run(name, 'readwrite', (s) => s.put(value)),
  del: (name, key) => idb.run(name, 'readwrite', (s) => s.delete(key)),
  keys: (name) => idb.run(name, 'readonly', (s) => s.getAllKeys()),
};

function setOnline(on) {
  if (net.online === on) return;
  net.online = on;
  document.body.classList.toggle('offline', !on);
  renderNet();
  renderPlayers();
  if (on) cameBack();
}
// Back in reach: send what was waiting, then take the server's view of things.
async function cameBack() {
  await flush();
  if (!net.online) return;
  await loadDocs();
  await loadNotes();
}
// While out of reach, look for the server every few seconds.
setInterval(() => { if (!net.online) call('/api/config', { cache: 'no-store' }).catch(() => {}); }, 4000);
window.addEventListener('online', () => call('/api/config', { cache: 'no-store' }).catch(() => {}));
window.addEventListener('unhandledrejection', (e) => {
  if (!e.reason?.offline) return;
  e.preventDefault();
  if (e.reason.method !== 'GET') { net.said = 'That change was not saved: the server is not reachable.'; renderNet(); setTimeout(() => { net.said = ''; renderNet(); }, 6000); }
});

function renderNet() {
  const box = $('net');
  if (!box) return;
  box.textContent = '';
  box.append(el('span', 'dot'), el('b', '', net.online ? 'Connected to the server' : 'Server not reachable'));
  if (!net.online) box.append(el('div', 'sub', 'Working from the copies on this device. New notes and files are held here and sent when it is back.'));
  if (outbox.length) box.append(el('div', 'sub', `${outbox.length} change${outbox.length > 1 ? 's' : ''} waiting to be sent`));
  const keepable = docs.filter((d) => canKeep(d.path) && !isPending(d.path)), have = keepable.filter((d) => kept.has(d.path)).length;
  const line = el('div', 'sub', `${have} of ${keepable.length} documents copied to this device `);
  if (net.online && have < keepable.length) {
    const all = el('button', '', 'keep all');
    all.onclick = async () => { all.disabled = true; for (const d of keepable) { if (!kept.has(d.path)) await keepCopy(d.path, true); } renderTree(); renderNet(); };
    line.append(all);
  }
  box.append(line, el('div', 'sub', '● on this device   ○ server only   ↑ waiting to be sent'));
  if (net.said) box.append(el('div', 'say', net.said));
}

// The text of a document: one added here and not yet sent, else from the
// server (keeping a copy), else the copy on this device. null if none.
async function docText(path) {
  if (isPending(path)) { const f = await idb.get('files', keyOf(path)); return f ? f.blob.text() : null; }
  try {
    const r = await call('/api/doc?path=' + encodeURIComponent(path));
    if (!r.ok) return '# Not found\n\nThis file is no longer in the folder.\n';
    const text = await r.text();
    rememberDoc(path, text);
    return text;
  } catch {
    const copy = await idb.get('docs', keyOf(path));
    return copy ? copy.text : null;
  }
}
async function rememberDoc(path, text) {
  const had = kept.has(path);
  await idb.put('docs', { key: keyOf(path), root: config.root, path, text, ts: Date.now() });
  kept.add(path);
  if (!had) { renderTree(); renderNet(); }
}
async function keepCopy(path, quiet) {
  try {
    const r = await call(isHtml(path) ? rawUrl(path) : '/api/doc?path=' + encodeURIComponent(path));
    if (r.ok) {
      const body = isAudio(path) ? { blob: await r.blob() } : { text: await r.text() };
      await idb.put('docs', { key: keyOf(path), root: config.root, path, ...body, ts: Date.now() });
      kept.add(path);
    }
  } catch {}
  if (!quiet) { renderTree(); renderNet(); renderPlayers(); }
}
async function dropCopy(path) {
  await idb.del('docs', keyOf(path));
  kept.delete(path);
  renderTree();
  renderNet();
  renderPlayers();

// ---- the outbox: changes are applied here first, then sent ------------------------
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const makeNote = (fields) => ({ id: newId(), heading: '', headingText: '', quote: '', type: '', text: '', ...fields, ts: new Date().toISOString(), status: fields.text ? 'open' : 'highlight' });
async function noteOp(op) {
  if (op.kind === 'add') notes.push(op.note);
  if (op.kind === 'set') {
    const n = notes.find((x) => x.id === op.id);
    if (n) { Object.assign(n, op.fields); if (n.status === 'highlight' && n.text) n.status = 'open'; }
  }
  if (op.kind === 'del') notes = notes.filter((x) => x.id !== op.id);
  outbox.push(op);
  saveLocal();
  renderNotes();
  renderTree();
  renderNet();
  await flush();
}
// Send waiting changes in the order they were made. Any answer from the server,
// even a refusal, settles that change; only silence keeps it waiting.
async function flush() {
  if (flushing) return;
  flushing = true;
  const json = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  let sentFile = false;
  try {
    while (outbox.length) {
      const op = outbox[0];
      if (op.kind === 'add') await call('/api/notes', json('POST', op.note));
      else if (op.kind === 'set') await call('/api/notes/' + op.id, json('PUT', op.fields));
      else if (op.kind === 'del') await call('/api/notes/' + op.id, json('DELETE'));
      else if (op.kind === 'file') {
        const f = await idb.get('files', keyOf(op.path));
        if (f) await call('/api/upload?path=' + encodeURIComponent(op.path), { method: 'POST', body: f.blob });
        await idb.del('files', keyOf(op.path));
        pendingFiles = pendingFiles.filter((x) => x.path !== op.path);
        sentFile = true;
      }
      outbox.shift();
      saveLocal();
    }
  } catch { /* still out of reach: everything left stays in the outbox */ }
  flushing = false;
  renderNet();
  if (sentFile && net.online) loadDocs();
}

// ---- adding files from this device -------------------------------------------------
// They go to the folder "inbox". With the server in reach they are sent at once;
// without it they wait here, already openable, and are sent later.
async function addFiles(fileList) {
  for (const file of fileList) {
    const name = file.name.replace(/[\\/]/g, ' ').replace(/^\.+/, '').trim();
    if (!name || file.size > 50 * 1024 * 1024) continue;
    let path = 'inbox/' + name;
    for (let n = 2; docs.some((d) => d.path === path); n++) path = 'inbox/' + name.replace(/(\.[^.]*)?$/, ` ${n}$1`);
    await idb.put('files', { key: keyOf(path), root: config.root, path, blob: file });
    pendingFiles.push({ path });
    outbox.push({ kind: 'file', path });
    docs.push({ path, group: 'inbox', title: name, side: false, front: false });
  }
  saveLocal();
  renderTree();
  renderNet();
  await flush();
  renderTree();
}
async function discardPending(path) {
  await idb.del('files', keyOf(path));
  pendingFiles = pendingFiles.filter((f) => f.path !== path);
  outbox = outbox.filter((op) => !(op.kind === 'file' && op.path === path));
  docs = docs.filter((d) => d.path !== path || serverDocs.some((x) => x.path === path));
  for (const [i, p] of state.panes.entries()) if (p.tabs.includes(path)) await closeTab(i, path);
  saveLocal();
  renderTree();
  renderNet();
}
$('addBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => { const files = [...e.target.files]; e.target.value = ''; addFiles(files); };
const sideEl = $('side');
sideEl.addEventListener('dragover', (e) => { if (e.dataTransfer?.types.includes('Files')) { e.preventDefault(); sideEl.classList.add('drop'); } });
sideEl.addEventListener('dragleave', () => sideEl.classList.remove('drop'));
sideEl.addEventListener('drop', (e) => { if (!e.dataTransfer?.files.length) return; e.preventDefault(); sideEl.classList.remove('drop'); addFiles([...e.dataTransfer.files]); });

// ---- file browser -----------------------------------------------------------
let serverDocs = [];
async function loadDocs() {
  try { serverDocs = await api('/api/docs'); store.set('docs:' + config.root, serverDocs); }
  catch { serverDocs = store.get('docs:' + config.root) || serverDocs; }
  // Files added on this device and not yet sent appear in the list too.
  const waiting = pendingFiles.filter((f) => !serverDocs.some((d) => d.path === f.path))
    .map((f) => ({ path: f.path, group: f.path.split('/').slice(0, -1).join('/'), title: f.path.split('/').pop(), side: false, front: false }));
  docs = serverDocs.concat(waiting);
  renderTree();
  renderNet();
  renderPlayers();
}

function renderTree() {
  const y = treeEl.scrollTop;
  treeEl.innerHTML = '';
  const root = { dirs: {}, files: [] };
  for (const d of docs) {
    if (d.front) continue;
    let node = root;
    for (const part of d.path.split('/').slice(0, -1)) node = node.dirs[part] ??= { dirs: {}, files: [] };
    node.files.push(d);
  }
  const front = docs.find((d) => d.front);
  if (front) treeEl.append(fileRow(front, 'Front page'));
  (function draw(node, parent, prefix) {
    for (const [name, sub] of Object.entries(node.dirs)) {
      const det = el('details');
      det.open = !state.closed.includes(prefix + name);
      det.append(el('summary', '', name));
      det.addEventListener('toggle', () => {
        state.closed = state.closed.filter((p) => p !== prefix + name);
        if (!det.open) state.closed.push(prefix + name);
        save();
      });
      const kids = el('div', 'kids');
      det.append(kids);
      draw(sub, kids, prefix + name + '/');
      parent.append(det);
    }
    for (const f of node.files) parent.append(fileRow(f));
  })(root, treeEl, '');
  treeEl.scrollTop = y;
}

function fileRow(d, label) {
  const row = el('div', 'file');
  row.tabIndex = 0;
  row.setAttribute('role', 'button');
  row.dataset.path = d.path;
  row.title = d.title;
  if (state.panes.some((p) => p.tabs.includes(d.path))) row.classList.add('open');
  if (d.path === activeDoc()) row.classList.add('active');
  row.append(el('span', 'name', label || d.path.split('/').pop()));
  const n = notes.filter((x) => x.doc === d.path).length;
  if (n) row.append(el('small', '', n));
  const plus = el('button', 'plus', '+');
  plus.title = 'Open alongside what is already open';
  plus.setAttribute('aria-label', 'Open alongside what is already open');
  plus.onclick = (e) => { e.stopPropagation(); openDoc(d.path, { keep: true }); };
  row.append(plus);
  // Where this file is: waiting to be sent, copied to this device, or on the server only.
  if (isPending(d.path) || canKeep(d.path)) {
    const pend = isPending(d.path), here = kept.has(d.path);
    const st = el('button', 'st ' + (pend ? 'wait' : here ? 'kept' : ''), pend ? '↑' : here ? '●' : '○');
    st.title = pend ? 'Added on this device, waiting to be sent to the server. Press to discard it.'
      : here ? 'A copy is on this device, so it opens without the server. Press to remove the copy.'
      : 'On the server only. Press to keep a copy on this device.';
    st.setAttribute('aria-label', st.title);
    st.onclick = (e) => { e.stopPropagation(); if (pend) discardPending(d.path); else if (here) dropCopy(d.path); else keepCopy(d.path); };

  side.onclick = (e) => { e.stopPropagation(); openDoc(d.path, { side: true }); };

// ---- panes and tabs ---------------------------------------------------------
// Open a document. A plain open takes the place of the pane's preview tab (the
// one opened by the last single click); `keep` adds it as a tab that stays.
// `side` puts it in the right-hand pane, splitting if needed.
async function openDoc(path, { pane = state.active, side = false, hash, keep = false } = {}) {
  if (!docOf(path)) return;
  if (phone.matches) { side = false; drawer(null); }   // one document at a time on a phone
  let rebuilt = false;
  if (side) {
    if (state.panes.length < 2) { state.panes.push({ tabs: [], active: null, preview: null }); rebuilt = true; pane = 1; }
    else pane = pane === 0 ? 1 : 0;
  }
  const p = state.panes[pane];
  remember(pane);
  if (!p.tabs.includes(path)) {
    const at = keep ? -1 : p.tabs.indexOf(p.preview);
    if (at >= 0) { p.bumped = { path: p.preview, by: path, at: Date.now() }; p.tabs[at] = path; } else p.tabs.push(path);
    if (!keep) p.preview = path;
  }
  if (keep && p.preview === path) {
    // A double click arrives as click + click: the first click has already
    // replaced the previewed document, so put that one back beside the new one.
    const b = p.bumped;
    p.preview = null;
    if (b && b.by === path && Date.now() - b.at < 800 && docOf(b.path) && !p.tabs.includes(b.path)) {
      p.tabs.splice(p.tabs.indexOf(path), 0, b.path);
      p.preview = b.path;
    }
  }
  p.active = path;
  state.active = pane;
  if (rebuilt) await buildPanes(); else { renderTabs(pane); await showDoc(pane, hash); }
  if (rebuilt && hash) goTo(pane, hash);
  chrome();
}

async function closeTab(pane, path) {
  const p = state.panes[pane];
  const at = p.tabs.indexOf(path);
  p.tabs.splice(at, 1);
  if (p.preview === path) p.preview = null;
  scrollMem.delete(pane + ':' + path);
  if (p.active === path) p.active = p.tabs[Math.min(at, p.tabs.length - 1)] || null;
  if (!p.tabs.length && state.panes.length > 1) {
    state.panes.splice(pane, 1);
    state.active = 0;
    scrollMem.clear();
    await buildPanes();
  } else {
    // Closing the last document falls back to the front page.
    if (!p.tabs.length && config.front) { p.tabs.push(config.front); p.active = p.preview = config.front; }
    renderTabs(pane);
    await showDoc(pane);
  }
  chrome();
}

function remember(pane) {
  const v = views[pane], path = state.panes[pane]?.active;
  if (v?.scroller && path) scrollMem.set(pane + ':' + path, v.scroller.scrollTop);
}

function setActive(pane) {
  if (state.active === pane) return;
  state.active = pane;
  chrome();
}

async function buildPanes() {
  panesEl.innerHTML = '';
  $('rightDoc').innerHTML = '';
  views.length = 0;
  state.panes.forEach((_, i) => {
    const root = el('section', 'pane'), tabsEl = el('div', 'tabs'), body = el('div', 'body');
    const bar = el('div', 'progress');
    bar.append(el('i'));
    root.append(tabsEl, bar, body);
    root.addEventListener('pointerdown', () => setActive(i), true);
    (i ? $('rightDoc') : panesEl).append(root);
    views.push({ root, tabsEl, body, bar: bar.firstChild, heads: [] });
  });
  applyLayout();
  await Promise.all(state.panes.map((_, i) => { renderTabs(i); return showDoc(i); }));
}

function renderTabs(pane) {
  const p = state.panes[pane], bar = views[pane].tabsEl;
  bar.innerHTML = '';
  for (const path of p.tabs) {
    const d = docOf(path);
    const tab = el('div', 'tab' + (path === p.active ? ' active' : '') + (path === p.preview ? ' preview' : ''));
    tab.tabIndex = 0;
    tab.setAttribute('role', 'button');
    tab.title = path + (path === p.preview ? '\n(double-click to keep open)' : '');
    tab.ondblclick = () => { if (p.preview === path) { p.preview = null; renderTabs(pane); save(); } };
    tab.append(el('span', '', d ? (d.front ? 'Front page' : d.title) : path));
    const x = el('button', '', '×');
    x.title = 'Close';
    x.onclick = (e) => { e.stopPropagation(); closeTab(pane, path); };
    tab.append(x);
    tab.onclick = async () => {
      if (p.active === path) return;
      remember(pane);
      p.active = path;
      renderTabs(pane);
      await showDoc(pane);
      chrome();
    };
    bar.append(tab);
  }
  if (p.active && isHtml(p.active)) {
    const on = scriptsOn(p.active);
    const sc = el('button', 'keep', on ? 'scripts: on' : 'scripts: off');
    sc.title = on ? 'This page\'s own scripts are running. Press to turn them off.' : 'This page\'s own scripts are switched off. Press to let them run (only for pages you trust).';
    sc.setAttribute('aria-pressed', on);
    sc.onclick = async () => { setScripts(p.active, !on); renderTabs(pane); await showDoc(pane); chrome(); };
    bar.append(sc);
  }
  if (p.active) {
    const split = el('button', '', state.panes.length > 1 ? 'to other side' : 'open on right');
    split.title = 'Open this document in the other pane';
    split.onclick = () => openDoc(p.active, { pane, side: true });
    bar.append(split);
  }
}

// ---- rendering a document into a pane ---------------------------------------
function slugify(text, used) {
  const s = text.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'section';
  let out = s, n = 2;
  while (used.has(out)) out = s + '-' + n++;
  used.add(out);
  return out;
}

// HTML files: whether a page's own scripts may run, remembered per file.
const scriptsOn = (path) => !!(view.scripts && view.scripts[path]);
function setScripts(path, on) {
  view.scripts = { ...(view.scripts || {}) };
  if (on) view.scripts[path] = true; else delete view.scripts[path];
  store.set('view', view);
}

// Source files are shown as one fenced code block, tagged with their language.
const LANG = { c: 'c', h: 'c', cpp: 'cpp', hpp: 'cpp', cc: 'cpp', py: 'python', js: 'javascript', ts: 'typescript', rs: 'rust', go: 'go', java: 'java', sh: 'bash', Makefile: 'makefile' };
async function fetchDoc(path) {
  let text = await docText(path);
  if (text == null) return '# Not on this device\n\nThe server is not reachable, and no copy of this document was kept here.\n';
  if (path.endsWith('.md')) return text;
  const fence = '`'.repeat(Math.max(3, ...(text.match(/`+/g) || []).map((t) => t.length + 1)));
  const name = path.split('/').pop();
  return `# ${name}\n\n${fence}${LANG[name.split('.').pop()] || ''}\n${text}\n${fence}\n`;
}

async function showDoc(pane, hash, keepScroll) {
  const v = views[pane], path = state.panes[pane].active;
  const y = v.scroller ? v.scroller.scrollTop : 0;
  Object.assign(v, { heads: [], cur: null, article: null, surface: null, scroller: null, frame: null });
  if (!path) { v.body.replaceChildren(el('p', 'empty', 'Nothing open. Pick a file on the left.')); return; }

  if (isAudio(path)) { showPlayer(pane, path); return; }
  if (isMedia(path)) {
    if (net.online) showMedia(pane, path);
    else v.body.replaceChildren(el('p', 'empty', 'The server is not reachable. Pictures, video and sound are not kept on this device yet.'));
    return;
  }

  // HTML files are shown as they are, in a frame.
  if (isHtml(path)) {
    const frame = el('iframe');
    // The page's own scripts stay off unless turned on for this file. Without
    // them the reader can still reach in to read headings and draw highlights.
    if (!scriptsOn(path)) frame.setAttribute('sandbox', 'allow-same-origin');
    frame.referrerPolicy = 'no-referrer';
    let bounced = false;
    if (net.online && !isPending(path)) {
      frame.src = rawUrl(path);
      call(rawUrl(path)).then((r) => (r.ok ? r.text() : null)).then((t) => t != null && rememberDoc(path, t)).catch(() => {});
    } else {
      // No server: show the copy kept on this device, if there is one.
      const copy = await docText(path);
      if (copy == null) { v.body.replaceChildren(el('p', 'empty', 'The server is not reachable, and no copy of this page was kept on this device.')); return; }
      frame.srcdoc = copy;
    }
    frame.onload = () => {
      try {
        const d = frame.contentDocument, used = new Set();
        v.heads = [...d.querySelectorAll('h1, h2, h3')];
        for (const h of v.heads) h.dataset.slug = slugify(h.textContent, used);
        v.surface = d.body;
        // No sideways sliding: the page scrolls up and down only. Images shrink
        // to fit; code blocks and tables that are too wide scroll inside themselves.
        const lock = d.createElement('style');
        lock.textContent = 'html, body { overflow-x: hidden !important; overscroll-behavior-x: none; max-width: 100%; }' +
          ' body { overflow-wrap: anywhere; } img, video, svg, canvas, iframe { max-width: 100%; height: auto; }' +
          ' pre { max-width: 100%; overflow-x: auto; }';
        d.head.append(lock);
        const wide = d.documentElement.clientWidth;
        for (const t of d.querySelectorAll('table')) {
          if (t.scrollWidth > wide) Object.assign(t.style, { display: 'block', maxWidth: '100%', overflowX: 'auto' });
        }
        const where = (r) => { const f = frame.getBoundingClientRect(); return { left: r.left + f.left, top: r.top + f.top, bottom: r.bottom + f.top, width: r.width, height: r.height }; };
        const offerFlyout = (below) => {
          const sel = d.getSelection();
          if (sel.isCollapsed || !sel.rangeCount || !pendingQuote) return;
          activeHl = null;
          showFlyout(where(sel.getRangeAt(0).getBoundingClientRect()), below);
        };
        d.addEventListener('pointerdown', (e) => {
          setActive(pane);
          hideFlyout();
          closeDial();
          if (e.target.closest?.('mark[data-note]') || (!activeHl && !pendingQuote)) return;
          activeHl = null;
          pendingQuote = '';
          renderContext();
          renderNotes(false);
          markActive();
        });
        d.addEventListener('selectionchange', () => {
          const sel = d.getSelection();
          if (sel.isCollapsed || !sel.rangeCount) return;
          takeSelection(sel.toString(), pane, sel.getRangeAt(0).startContainer);
          if (touch.matches) { clearTimeout(touchTimer); touchTimer = setTimeout(() => offerFlyout(true), 400); }
        });
        d.addEventListener('pointerup', () => setTimeout(() => offerFlyout(false)));
        d.addEventListener('click', (e) => {
          const mark = e.target.closest?.('mark[data-note]');
          if (mark) { e.preventDefault(); return selectHighlight(mark.dataset.note, where(mark.getBoundingClientRect())); }
          // Links never take the frame somewhere else. Another document in the
          // folder opens in the reader; anything on another site opens in a new
          // browser tab, outside the hub.
          const a = e.target.closest?.('a[href], area[href]');
          if (!a) return;
          let url;
          try { url = new URL(a.href, d.baseURI); } catch { return e.preventDefault(); }
          const here = new URL(d.location.href);
          if (url.origin === location.origin && url.pathname === here.pathname && url.hash) return; // a jump within this page
          e.preventDefault();
          if (url.origin !== location.origin) {
            if (/^https?:$/.test(url.protocol) || url.protocol === 'mailto:') window.open(url.href, '_blank', 'noopener,noreferrer');
            return;
          }
          const rel = url.pathname.startsWith('/raw/') ? decodeURIComponent(url.pathname.slice(5)) : null;
          if (rel && docOf(rel)) openDoc(rel, { pane, hash: decodeURIComponent(url.hash.slice(1)), side: e.metaKey || e.ctrlKey || e.altKey });
          else if (rel) window.open(url.href, '_blank', 'noopener');
        }, true);
        frame.contentWindow.addEventListener('scroll', () => { track(pane); hideFlyout(); }, { passive: true });
        highlightAll(v.surface, path);
        if (hash) goTo(pane, hash);
        track(pane);
      } catch {
        // The frame has left for another site (a redirect or a script, not a click).
        // Bring the saved page back; if it leaves again, stop and say so.
        v.heads = [];
        v.surface = null;
        if (!bounced) { bounced = true; frame.src = '/raw/' + path.split('/').map(encodeURIComponent).join('/'); }
        else v.body.replaceChildren(el('p', 'empty', 'This page keeps trying to leave for another site, so it was stopped. Turn its scripts off, or open the file in a browser tab instead.'));
      }
      if (pane === state.active) { renderOutline(); renderContext(); }
    };
    v.frame = frame;
    v.body.replaceChildren(frame);
    return;
  }

  const md = await fetchDoc(path);
  if (views[pane] !== v || state.panes[pane].active !== path) return; // changed while loading
  const scroller = el('div', 'scroller'), article = el('article', 'md');
  article.innerHTML = marked.parse(md);
  scroller.append(article);
  v.body.replaceChildren(scroller);
  Object.assign(v, { scroller, article, surface: article });

  const used = new Set();
  for (const h of article.querySelectorAll('h1, h2, h3')) {
    h.dataset.slug = slugify(h.textContent, used);
    h.id = `p${pane}-${h.dataset.slug}`;
    v.heads.push(h);
  }
  // Relative picture, video and sound paths load from the same storage.
  for (const m of article.querySelectorAll('img, video, audio, source')) {
    const src = m.getAttribute('src') || '';
    if (src && !/^([a-z]+:|\/)/i.test(src)) { m.dataset.path = resolve(path, src); m.src = rawUrl(m.dataset.path); }
    if (m.tagName === 'VIDEO') { m.controls = true; m.playsInline = true; m.preload = 'metadata'; }
  }
  colourCode(article);
  hideAnswers(article);
  if (path === config.front) {
    const b = el('button', 'editFront', 'edit front page');
    b.onclick = () => editFront(pane, md);
    article.prepend(b);
  }
  highlightAll(article, path);
  article.addEventListener('click', (e) => onDocClick(e, pane));
  article.addEventListener('pointerup', () => setTimeout(() => {
    const sel = window.getSelection();
    if (sel.isCollapsed || !sel.rangeCount || !pendingQuote || !article.contains(sel.anchorNode)) return;
    activeHl = null;
    showFlyout(sel.getRangeAt(0).getBoundingClientRect());
  }));
  scroller.addEventListener('scroll', () => { track(pane); hideFlyout(); }, { passive: true });
  article.addEventListener('mousemove', (e) => { if (view.focus) setHere(pane, e.target); });

  if (keepScroll) scroller.scrollTop = y;
  else if (hash) goTo(pane, hash);
  else scroller.scrollTop = scrollMem.get(pane + ':' + path) || 0;
  track(pane);
}

// Colour fenced code by the language named on the fence (```c, ```python, …).
// Blocks with no language, or one that isn't known, are left plain.
function colourCode(root) {
  if (!window.hljs) return;
  for (const code of root.querySelectorAll('pre code')) {
    const lang = (code.className.match(/language-([\w+#-]+)/) || [])[1];
    if (!lang || !hljs.getLanguage(lang)) continue;
    code.innerHTML = hljs.highlight(code.textContent, { language: lang, ignoreIllegals: true }).value;
  }
}

// ---- music ---------------------------------------------------------------------------
// One player for the whole reader, so music carries on while you read. Its
// playlist is every sound file in the folder, grouped by where it lives.
const player = new Audio();
player.preload = 'metadata';
const music = { path: null, url: null };
const tracks = () => docs.filter((d) => isAudio(d.path));
const playable = (path) => net.online || kept.has(path);
const clock = (t) => (isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00');

async function playTrack(path, start = true) {
  if (!playable(path)) { net.said = 'That track is not on this device, and the server is not reachable.'; renderNet(); return; }
  if (music.url) URL.revokeObjectURL(music.url);
  music.url = null;
  let src = rawUrl(path);
  if (kept.has(path)) { const copy = await idb.get('docs', keyOf(path)); if (copy?.blob) src = music.url = URL.createObjectURL(copy.blob); }
  music.path = path;
  player.src = src;
  if (start) player.play().catch(() => {});
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: path.split('/').pop(), album: path.split('/').slice(0, -1).join(' / ') });
  renderPlayers();
}
// Next, or previous. "Previous" first goes back to the start of the track; a
// second press within three seconds goes to the track before.
function stepTrack(dir) {
  const list = tracks().filter((t) => playable(t.path));
  if (!list.length) return;
  if (dir < 0 && player.currentTime > 3) { player.currentTime = 0; return; }
  const at = list.findIndex((t) => t.path === music.path);
  playTrack(list[(at + dir + list.length) % list.length].path);
}
const togglePlay = () => { if (!music.path) { const first = tracks().find((t) => playable(t.path)); if (first) playTrack(first.path); } else if (player.paused) player.play().catch(() => {}); else player.pause(); };
player.addEventListener('ended', () => stepTrack(1));
for (const ev of ['play', 'pause', 'timeupdate', 'loadedmetadata', 'emptied']) player.addEventListener(ev, tickPlayers);
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('previoustrack', () => stepTrack(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => stepTrack(1));
}
if (view.volume != null) player.volume = view.volume;

function transport(withSeek) {
  const row = el('div', 'pl-row');
  const prev = el('button', '', 'previous'), play = el('button', 'pl-play', 'play'), next = el('button', '', 'next');
  prev.title = 'Back to the start; press again for the track before';
  prev.onclick = () => stepTrack(-1);
  play.onclick = togglePlay;
  next.onclick = () => stepTrack(1);
  row.append(prev, play, next);
  if (!withSeek) return row;
  const seek = el('input', 'pl-seek');
  seek.type = 'range'; seek.min = 0; seek.max = 1000; seek.value = 0;
  seek.setAttribute('aria-label', 'Position in the track');
  seek.oninput = () => { if (isFinite(player.duration)) player.currentTime = (seek.value / 1000) * player.duration; };
  row.append(seek, el('span', 'pl-time', '0:00 / 0:00'));
  // On a phone the device's own volume buttons do this job.
  if (!touch.matches) {
    const vol = el('input', 'pl-vol');
    vol.type = 'range'; vol.min = 0; vol.max = 100; vol.value = Math.round(player.volume * 100);
    vol.title = 'Volume';
    vol.setAttribute('aria-label', 'Volume');
    vol.oninput = () => { player.volume = vol.value / 100; view.volume = player.volume; store.set('view', view); };
    row.append(vol);
  }
  return row;
}
function showPlayer(pane, path) {
  const v = views[pane];
  const box = el('div', 'player');
  v.bar.style.width = '0%';
  v.body.replaceChildren(box);
  if (path !== music.path) playTrack(path); else renderPlayers();
}
function renderPlayers() {
  const name = music.path ? music.path.split('/').pop() : 'Nothing playing', dir = music.path ? music.path.split('/').slice(0, -1).join(' / ') || 'top level' : '';
  for (const box of document.querySelectorAll('.player')) {
    box.replaceChildren(el('div', 'now', name), el('div', 'where', dir), transport(true));
    let group = null;
    for (const t of tracks()) {
      const folder = t.path.split('/').slice(0, -1).join(' / ') || 'top level';
      if (folder !== group) { group = folder; box.append(el('h5', '', folder)); }
      const here = kept.has(t.path), ok = playable(t.path);
      const row = el('div', 'track' + (t.path === music.path ? ' cur' : '') + (ok ? '' : ' gone'));
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      const st = el('button', 'st' + (here ? ' kept' : ''), here ? '●' : '○');
      st.title = here ? 'On this device. Press to remove the copy.' : 'On the server only. Press to keep a copy on this device.';
      st.setAttribute('aria-label', st.title);
      st.onclick = (e) => { e.stopPropagation(); if (here) dropCopy(t.path); else keepCopy(t.path); };
      row.append(st, el('span', '', t.path.split('/').pop()), el('small', '', here ? 'on this device' : ok ? 'server only' : 'not available offline'));
      row.onclick = () => ok && playTrack(t.path);
      box.append(row);
    }
    if (!tracks().length) box.append(el('p', 'empty', 'No sound files in this folder yet.'));
  }
  const mini = $('mini');
  mini.hidden = !music.path;
  if (music.path) {
    const title = el('a', '', '♪ ' + name);
    title.title = 'Open the player and playlist';
    title.onclick = () => openDoc(music.path);
    mini.replaceChildren(title, transport(false));
  }
  tickPlayers();
}
function tickPlayers() {
  for (const b of document.querySelectorAll('.pl-play')) b.textContent = player.paused ? 'play' : 'pause';
  for (const t of document.querySelectorAll('.pl-time')) t.textContent = clock(player.currentTime) + ' / ' + clock(player.duration);
  for (const sk of document.querySelectorAll('.pl-seek')) if (document.activeElement !== sk) sk.value = isFinite(player.duration) && player.duration ? (player.currentTime / player.duration) * 1000 : 0;
}

// Pictures, video and sound. A picture starts fitted to the pane; clicking it
// (or the button) switches to its real size, keeping the clicked spot in place.
function showMedia(pane, path) {
  const v = views[pane], url = rawUrl(path);
  const box = el('div', 'viewer'), bar = el('div', 'viewbar'), stage = el('div', 'stage fit');
  bar.append(el('span', '', path.split('/').pop()));
  const open = el('a', '', 'open in new tab');
  open.href = url;
  open.target = '_blank';
  open.rel = 'noopener';
  if (isImage(path)) {
    const img = el('img');
    img.alt = path.split('/').pop();
    img.decoding = 'async';
    const size = el('button', '', 'full size');
    const setFit = (fit, at) => {
      // Where the pointer is, as a fraction of the picture, so that spot stays put.
      const r = img.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const fx = at ? (at.clientX - r.left) / r.width : 0.5, fy = at ? (at.clientY - r.top) / r.height : 0.5;
      const px = at ? at.clientX - s.left : s.width / 2, py = at ? at.clientY - s.top : s.height / 2;
      stage.classList.toggle('fit', fit);
      size.textContent = fit ? 'full size' : 'fit to window';
      if (!fit) { stage.scrollLeft = fx * img.naturalWidth - px; stage.scrollTop = fy * img.naturalHeight - py; }
    };
    img.onload = () => { bar.firstChild.textContent = `${img.alt}  ·  ${img.naturalWidth} × ${img.naturalHeight}`; };
    img.onclick = (e) => setFit(!stage.classList.contains('fit'), e);
    size.onclick = () => setFit(!stage.classList.contains('fit'));
    img.src = url;
    stage.append(img);
    bar.append(size);
  } else if (isVideo(path)) {
    const video = el('video');
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.src = url;
    const full = el('button', '', 'full screen');
    full.onclick = () => (video.requestFullscreen || video.webkitEnterFullscreen)?.call(video);
    stage.append(video);
    bar.append(full);
  } else {
    const audio = el('audio');
    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = url;
    stage.append(audio);
  }
  bar.append(open);
  box.append(bar, stage);
  v.bar.style.width = '0%';
  v.body.replaceChildren(box);
}

// "Check Yourself" blocks: hide the answer until asked for.
function hideAnswers(root) {
  for (const bq of root.querySelectorAll('blockquote')) {
    const start = [...bq.children].find((c) => /^Answer/.test(c.querySelector('strong')?.textContent || ''));
    if (!start) continue;
    const details = el('details');
    start.before(details);
    details.append(el('summary', '', 'Show answer'));
    while (details.nextSibling) details.append(details.nextSibling);
  }
}

// The front page can be edited in place; it is saved back to FRONTPAGE.md.
function editFront(pane, md) {
  editing = true;
  const box = el('div', 'frontEditor'), ta = el('textarea');
  ta.value = md;
  const done = async () => { editing = false; await showDoc(pane); chrome(); };
  const saveBtn = el('button', '', 'Save');
  saveBtn.onclick = async () => { await api('/api/front', 'PUT', { markdown: ta.value }); await loadConfig(); done(); };
  const cancel = el('button', '', 'Cancel');

  box.append(el('p', '', 'Markdown. The first "# Heading" is the title; everything after it is the description.'), ta, saveBtn, cancel);

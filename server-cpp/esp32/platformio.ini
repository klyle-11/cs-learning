; The hub on a LilyGO T3-S3 V1.3, built with PlatformIO (Arduino-ESP32 core,
; which is ESP-IDF underneath). Same server sources as the desktop build.
; Needs Arduino-ESP32 3.x (ESP-IDF 5.x): if `pio run` reports a missing
; esp_netif_sntp.h, the platform below gave 2.x; use the community one instead:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;
;   export HUB_WIFI_SSID="network name" HUB_WIFI_PASSWORD="password"   (or wifi.txt on the card, see README.md)
;   export HUB_UPDATE_REPO="owner/repo"                                 (optional: firmware updates, see README.md)
;   pio run -d server-cpp/esp32                 build
;   pio run -d server-cpp/esp32 -t upload       flash (board on USB-C; hold BOOT while plugging in if it will not take it)
;   pio device monitor -d server-cpp/esp32      watch it start: address, fingerprint, pairing code
;
; menuconfig settings (Hub) do not reach this build: the OLED options and the
; star are the CONFIG_HUB_* defines below, and rollback of a failed update
; depends on the Arduino core's own bootloader settings.
; mbedTLS putting its buffers in PSRAM is an ESP-IDF build setting
; (sdkconfig.defaults); under Arduino it follows the core's own.
[platformio]
default_envs = t3s3
src_dir = ..
build_dir = .pio/build

[env:t3s3]
; LilyGO T3-S3 V1.3: ESP32-S3FH4R2, 4 MB flash, 2 MB quad-SPI PSRAM, USB-C on
; the chip's own USB. (LilyGO's own board file is t3_s3_v1_x.json in their
; LilyGo-LoRa-Series repository; this is the same set-up on a stock board.)
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
build_src_filter = -<*> +<src/hub.cpp> +<vendor/cJSON.c> +<esp32/main/board.cpp> +<esp32/main/screen.cpp> +<esp32/main/update.cpp>
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
  -std=gnu++17
  -I../src
  -I../vendor
  -Imain
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DHUB_WIFI_SSID=\"${sysenv.HUB_WIFI_SSID}\"
  -DHUB_WIFI_PASSWORD=\"${sysenv.HUB_WIFI_PASSWORD}\"
  -DHUB_UPDATE_REPO=\"${sysenv.HUB_UPDATE_REPO}\"
  ; -DCONFIG_HUB_OLED_SH1106
  ; -DCONFIG_HUB_OLED_FLIP
  ; -DCONFIG_HUB_STAR_WIDE      the star beside the title: _WIDE, _BURST or _TURNS (all three in turn); the tall one if none
monitor_speed = 115200
